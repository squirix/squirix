name: Run Test Suite
description: Download build outputs and run one CI test suite (optional coverage on Ubuntu).

inputs:
  os:
    description: Runner OS label matching artifact name (ubuntu-latest, ubuntu-arm, windows-latest, macos-latest).
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  suite:
    description: Suite id (unit, client-integration, server-unit, server-integration, smoke, e2e-single-node, e2e-multi-node, protocol-model).
    required: true
  collect-coverage:
    description: When true, collect Coverlet coverage (Ubuntu only).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select Runner Mode
      id: mode
      shell: bash
      run: |
        # Pull requests run without coverage. `dotnet test` needs a package restore (hence the NuGet cache) only to
        # discover the project; the built test host in bin is self-contained, so that path runs it directly.
        echo "direct=${{ github.event_name == 'pull_request' && inputs.collect-coverage != 'true' }}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-quality: preview
        global-json-file: global.json

    - name: Cache NuGet Packages
      if: steps.mode.outputs.direct != 'true'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-dotnet10-nuget-

    - name: Download Build Outputs
      uses: actions/download-artifact@v8
      with:
        name: build-output-${{ inputs.os }}-${{ inputs.framework }}
        path: .

    - name: Restore (Resolve Packages For Collectors)
      if: steps.mode.outputs.direct != 'true'
      shell: bash
      run: dotnet restore squirix.slnx

    - name: Restore Executable Bits For Test Hosts (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Artifact download drops +x; TUnit launches the apphost and needs execute bits on Linux/macOS.
        chmod +x tests/squirix/squirix.*-tests/bin/Release/${{ inputs.framework }}/Squirix.*Tests || true
        chmod +x tests/squirix.server/squirix.server.*-tests/bin/Release/${{ inputs.framework }}/Squirix.*Tests || true
        chmod +x tests/squirix.e2e.tests/bin/Release/${{ inputs.framework }}/Squirix.E2ETests || true
        chmod +x tests/squirix.protocol-model/squirix.protocol-model.tests/bin/Release/${{ inputs.framework }}/Squirix.ProtocolModel.Tests || true

    - name: Ensure Dev HTTPS Certificate
      shell: bash
      run: bash tools/ci/ensure-dev-https-cert.sh

    - name: Shim python3 On Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python="$(type -p python)"
        cp "$python" "$(dirname "$python")"/python3

    - name: Select Test Suite
      id: select
      shell: bash
      run: |
        python3 tools/ci/select-test-suite.py "${{ inputs.suite }}" >> "$GITHUB_OUTPUT"

    - name: Run Test Suite
      shell: bash
      env:
        PROJECT: ${{ steps.select.outputs.project }}
        FILTER: ${{ steps.select.outputs.filter }}
        DIRECT: ${{ steps.mode.outputs.direct }}
      run: |
        set -o pipefail
        echo "Suite '${{ inputs.suite }}': project '$PROJECT', filter '${FILTER:-<none>}'."
        FILTER_ARGS=()
        if [ -n "$FILTER" ]; then
          FILTER_ARGS=(--treenode-filter "$FILTER")
        fi

        if [ "$DIRECT" = "true" ]; then
          # The test host is named after its project; it accepts the same Microsoft.Testing.Platform options and exit codes.
          "$(dirname "$PROJECT")/bin/Release/${{ inputs.framework }}/$(basename "$PROJECT" .csproj)" \
            "${FILTER_ARGS[@]}" \
            --report-trx --report-trx-filename ${{ inputs.suite }}.trx \
            --results-directory "${{ github.workspace }}/TestResults" \
            --timeout 1h 2>&1 | tee "test-output-${{ inputs.suite }}.log"
        elif [ "${{ inputs.collect-coverage }}" = "true" ]; then
          mkdir -p "coverage/${{ inputs.suite }}"
          dotnet test --project "$PROJECT" --framework ${{ inputs.framework }} --configuration Release --no-build --verbosity normal \
            "${FILTER_ARGS[@]}" \
            --report-trx --report-trx-filename ${{ inputs.suite }}.trx \
            --results-directory "${{ github.workspace }}/coverage/${{ inputs.suite }}" \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml \
            --timeout 1h 2>&1 | tee "test-output-${{ inputs.suite }}.log"
        else
          dotnet test --project "$PROJECT" --framework ${{ inputs.framework }} --configuration Release --no-build --verbosity normal \
            "${FILTER_ARGS[@]}" \
            --report-trx --report-trx-filename ${{ inputs.suite }}.trx \
            --timeout 1h 2>&1 | tee "test-output-${{ inputs.suite }}.log"
        fi

    - name: Fail On Empty Test Selection
      shell: bash
      run: |
        if grep -q "Zero tests ran" "test-output-${{ inputs.suite }}.log"; then
          echo "Suite '${{ inputs.suite }}' matched zero tests. Failing the build." >&2
          exit 1
        fi

    - name: Verify Suite Coverage Was Collected
      if: inputs.collect-coverage == 'true'
      shell: bash
      run: |
        mapfile -t files < <(find "coverage/${{ inputs.suite }}" -name coverage.cobertura.xml -type f 2>/dev/null || true)
        if [ ${#files[@]} -eq 0 ]; then
          echo "Suite '${{ inputs.suite }}' passed, but no coverage.cobertura.xml was produced." >&2
          echo "Coverage directory contents:" >&2
          find "coverage/${{ inputs.suite }}" -type f -print 2>/dev/null || true
          ls -R "coverage/${{ inputs.suite }}" || true
          exit 1
        fi

    - name: Upload Raw Coverage Files
      if: always() && inputs.collect-coverage == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-raw-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: |
          coverage/**/coverage.cobertura.xml
        if-no-files-found: error

    - name: Upload Test Results (TRX)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ inputs.os }}-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: '**/*.trx'
        if-no-files-found: warn

    - name: Fail On gRPC Cancellation Errors In Logs
      if: always()
      shell: bash
      run: |
        if grep -Ei 'gRPC method .+ (task )?canceled' "test-output-${{ inputs.suite }}.log"; then
          echo "Found gRPC cancellation errors in logs. Failing the build." >&2
          exit 1
        else
          echo "No gRPC cancellation errors detected."
        fi
