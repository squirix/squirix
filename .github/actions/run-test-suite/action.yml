name: Run Test Suite
description: Download build outputs and run one CI test suite or suite group (optional coverage on Ubuntu).

inputs:
  os:
    description: Runner OS label matching artifact name (ubuntu-latest, ubuntu-arm, windows-latest, macos-latest).
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  suite:
    description: Suite or group id defined in tools/ci/select-test-suite.py (for example unit, server-unit, server-unit-a, e2e-multi-node, or the light group).
    required: true
  collect-coverage:
    description: When true, collect Coverlet coverage (Ubuntu only).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select Runner Mode
      id: mode
      shell: bash
      run: |
        # Jobs without coverage run the built test host directly: `dotnet test` needs a package restore (hence the NuGet cache) only to
        # discover the project, and the host in bin is self-contained. That is every Windows and macOS job and, on Linux, the pull
        # request jobs (Linux push jobs collect coverage; ARM keeps `dotnet test`). Linux also skips installing the SDK pinned in
        # global.json because the runner image already ships the runtime the host needs.
        echo "direct=${{ inputs.collect-coverage != 'true' && (runner.os != 'Linux' || github.event_name == 'pull_request') }}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      if: steps.mode.outputs.direct != 'true' || runner.os != 'Linux'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Cache NuGet Packages
      if: steps.mode.outputs.direct != 'true'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-dotnet10-nuget-

    - name: Download Build Outputs
      uses: actions/download-artifact@v8
      with:
        name: build-output-${{ inputs.os }}-${{ inputs.framework }}
        path: .

    - name: Restore (Resolve Packages For Collectors)
      if: steps.mode.outputs.direct != 'true'
      shell: bash
      run: dotnet restore squirix.slnx

    - name: Restore Executable Bits For Test Hosts (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Artifact download drops +x; TUnit launches the apphost and needs execute bits on Linux/macOS.
        chmod +x tests/squirix/squirix.*-tests/bin/Release/${{ inputs.framework }}/Squirix.*Tests || true
        chmod +x tests/squirix.server/squirix.server.*-tests/bin/Release/${{ inputs.framework }}/Squirix.*Tests || true
        chmod +x tests/squirix.e2e.tests/bin/Release/${{ inputs.framework }}/Squirix.E2ETests || true
        chmod +x tests/squirix.protocol-model/squirix.protocol-model.tests/bin/Release/${{ inputs.framework }}/Squirix.ProtocolModel.Tests || true

    - name: Shim python3 On Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Newer images already ship python3.exe next to python; copying over it fails with "are the same file".
        python="$(type -p python)"
        dir="$(dirname "$python")"
        if [ ! -e "$dir/python3" ] && [ ! -e "$dir/python3.exe" ]; then
          cp "$python" "$dir/python3"
        fi

    - name: Select Test Suite
      id: select
      shell: bash
      run: |
        python3 tools/ci/select-test-suite.py "${{ inputs.suite }}" >> "$GITHUB_OUTPUT"

    # Creating and trusting the certificate costs 1-13 s of SDK start-up per job, so suites that cannot host a server skip it.
    - name: Ensure Dev HTTPS Certificate
      if: steps.select.outputs.https_cert == 'true' && (steps.mode.outputs.direct != 'true' || runner.os != 'Linux')
      shell: bash
      run: bash tools/ci/ensure-dev-https-cert.sh

    - name: Ensure Dev HTTPS Certificate (Runner SDK)
      if: steps.select.outputs.https_cert == 'true' && steps.mode.outputs.direct == 'true' && runner.os == 'Linux'
      shell: bash
      # The SDK pinned in global.json is not installed on this path; run outside the repository so the runner's SDK is used.
      working-directory: ${{ runner.temp }}
      run: bash "${{ github.workspace }}/tools/ci/ensure-dev-https-cert.sh"

    # A suite id selects one test host run, or for a group several runs back to back. Every run keeps its own name for the
    # log, the TRX file and the coverage directory, so a single suite produces the same files whether it runs alone or in a group.
    - name: Run Test Suite
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
        DIRECT: ${{ steps.mode.outputs.direct }}
      run: |
        set -o pipefail
        failed=()
        # The runs are read from descriptor 3 so a test host cannot consume the remaining lines through its standard input.
        while IFS=$'\t' read -r -u 3 name project filter; do
          if [ -z "$name" ]; then continue; fi
          echo "Suite '$name': project '$project', filter '${filter:-<none>}'."
          filter_args=()
          if [ -n "$filter" ]; then
            filter_args=(--treenode-filter "$filter")
          fi

          status=0
          if [ "$DIRECT" = "true" ]; then
            # The test host is named after its project; it accepts the same Microsoft.Testing.Platform options and exit codes.
            host="$(dirname "$project")/bin/Release/${{ inputs.framework }}/$(basename "$project" .csproj)"
            if [ "$RUNNER_OS" = "Windows" ]; then host="$host.exe"; fi
            "$host" \
              "${filter_args[@]}" \
              --report-trx --report-trx-filename "$name.trx" \
              --results-directory "${{ github.workspace }}/TestResults" \
              --timeout 1h 2>&1 | tee "test-output-$name.log" || status=$?
          elif [ "${{ inputs.collect-coverage }}" = "true" ]; then
            mkdir -p "coverage/$name"
            dotnet test --project "$project" --framework ${{ inputs.framework }} --configuration Release --no-build --verbosity normal \
              "${filter_args[@]}" \
              --report-trx --report-trx-filename "$name.trx" \
              --results-directory "${{ github.workspace }}/coverage/$name" \
              --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml \
              --timeout 1h 2>&1 | tee "test-output-$name.log" || status=$?
          else
            dotnet test --project "$project" --framework ${{ inputs.framework }} --configuration Release --no-build --verbosity normal \
              "${filter_args[@]}" \
              --report-trx --report-trx-filename "$name.trx" \
              --timeout 1h 2>&1 | tee "test-output-$name.log" || status=$?
          fi

          # A group keeps going after a failed suite so one job reports every failing suite, then fails as a whole.
          if [ "$status" -ne 0 ]; then
            echo "Suite '$name' failed with exit code $status." >&2
            failed+=("$name")
          fi
        done 3<<< "$RUNS"

        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed suites: ${failed[*]}" >&2
          exit 1
        fi

    - name: Fail On Empty Test Selection
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
      run: |
        while IFS=$'\t' read -r name _; do
          if [ -z "$name" ]; then continue; fi
          if grep -q "Zero tests ran" "test-output-$name.log"; then
            echo "Suite '$name' matched zero tests. Failing the build." >&2
            exit 1
          fi
        done <<< "$RUNS"

    - name: Verify Suite Coverage Was Collected
      if: inputs.collect-coverage == 'true'
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
      run: |
        while IFS=$'\t' read -r name _; do
          if [ -z "$name" ]; then continue; fi
          mapfile -t files < <(find "coverage/$name" -name coverage.cobertura.xml -type f 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Suite '$name' passed, but no coverage.cobertura.xml was produced." >&2
            echo "Coverage directory contents:" >&2
            find "coverage/$name" -type f -print 2>/dev/null || true
            ls -R "coverage/$name" || true
            exit 1
          fi
        done <<< "$RUNS"

    - name: Upload Raw Coverage Files
      if: always() && inputs.collect-coverage == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-raw-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: |
          coverage/**/coverage.cobertura.xml
        if-no-files-found: error

    - name: Upload Test Results (TRX)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ inputs.os }}-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: '**/*.trx'
        if-no-files-found: warn

    - name: Fail On gRPC Cancellation Errors In Logs
      if: always()
      shell: bash
      run: |
        if grep -Ei 'gRPC method .+ (task )?canceled' test-output-*.log; then
          echo "Found gRPC cancellation errors in logs. Failing the build." >&2
          exit 1
        else
          echo "No gRPC cancellation errors detected."
        fi
