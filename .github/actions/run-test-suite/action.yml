name: Run Test Suite
description: Download the build outputs and run one CI test suite or suite group, with coverage when asked.

inputs:
  os:
    description: Runner kind (ubuntu-latest, ubuntu-arm, windows-latest, macos-latest); it names the uploaded test results.
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  suite:
    description: Suite or group id defined in tools/ci/select-test-suite.py (for example server-integration, or the light-e2e group).
    required: true
  collect-coverage:
    description: When true, the test hosts also write Cobertura coverage, one report per suite.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Every runner kind tests the outputs of the one ubuntu build. They are portable: the assemblies are the same whatever
    # system compiles them, and the output folders carry the native assets of every test platform. A test assembly needs only
    # the .NET 10 runtime, which every runner image ships, so no job installs the SDK pinned in global.json.
    - name: Download Build Outputs
      uses: actions/download-artifact@v8
      with:
        name: build-output-ubuntu-latest-${{ inputs.framework }}
        path: .

    - name: Shim python3 On Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Newer images already ship python3.exe next to python; copying over it fails with "are the same file".
        python="$(type -p python)"
        dir="$(dirname "$python")"
        if [ ! -e "$dir/python3" ] && [ ! -e "$dir/python3.exe" ]; then
          cp "$python" "$dir/python3"
        fi

    - name: Select Test Suite
      id: select
      shell: bash
      run: |
        python3 tools/ci/select-test-suite.py "${{ inputs.suite }}" >> "$GITHUB_OUTPUT"

    # Creating and trusting the certificate costs 1-13 s of SDK start-up per job, so suites that cannot host a server skip it.
    - name: Ensure Dev HTTPS Certificate
      if: steps.select.outputs.https_cert == 'true'
      shell: bash
      # The SDK pinned in global.json is not installed here; run outside the repository so the SDK of the runner image is used.
      working-directory: ${{ runner.temp }}
      run: bash "${{ github.workspace }}/tools/ci/ensure-dev-https-cert.sh"

    # A suite id selects one test host run, or for a group several runs back to back. Every run keeps its own name for the
    # log, the TRX file and the coverage directory, so a single suite produces the same files whether it runs alone or in a group.
    - name: Run Test Suite
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
      run: |
        set -o pipefail
        failed=()
        # The runs are read from descriptor 3 so a test host cannot consume the remaining lines through its standard input.
        while IFS=$'\t' read -r -u 3 name project filter; do
          if [ -z "$name" ]; then continue; fi
          echo "Suite '$name': project '$project', filter '${filter:-<none>}'."
          filter_args=()
          if [ -n "$filter" ]; then
            filter_args=(--treenode-filter "$filter")
          fi

          # The test assembly is named after its project and takes the Microsoft.Testing.Platform options. It starts through
          # the dotnet host of the runner, because the native launcher next to it belongs to the system that built it.
          host="$(dirname "$project")/bin/Release/${{ inputs.framework }}/$(basename "$project" .csproj).dll"
          results="${{ github.workspace }}/TestResults"
          coverage_args=()
          if [ "${{ inputs.collect-coverage }}" = "true" ]; then
            # The coverage extension is part of the host. Each suite writes into a directory of its own.
            results="${{ github.workspace }}/coverage/$name"
            mkdir -p "$results"
            coverage_args=(--coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml)
          fi

          status=0
          dotnet "$host" \
            "${filter_args[@]}" \
            --report-trx --report-trx-filename "$name.trx" \
            --results-directory "$results" \
            "${coverage_args[@]}" \
            --timeout 1h 2>&1 | tee "test-output-$name.log" || status=$?

          # A group keeps going after a failed suite so one job reports every failing suite, then fails as a whole.
          if [ "$status" -ne 0 ]; then
            echo "Suite '$name' failed with exit code $status." >&2
            failed+=("$name")
          fi
        done 3<<< "$RUNS"

        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed suites: ${failed[*]}" >&2
          exit 1
        fi

    - name: Fail On Empty Test Selection
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
      run: |
        while IFS=$'\t' read -r name _; do
          if [ -z "$name" ]; then continue; fi
          if grep -q "Zero tests ran" "test-output-$name.log"; then
            echo "Suite '$name' matched zero tests. Failing the build." >&2
            exit 1
          fi
        done <<< "$RUNS"

    - name: Verify Suite Coverage Was Collected
      if: inputs.collect-coverage == 'true'
      shell: bash
      env:
        RUNS: ${{ steps.select.outputs.runs }}
      run: |
        while IFS=$'\t' read -r name _; do
          if [ -z "$name" ]; then continue; fi
          mapfile -t files < <(find "coverage/$name" -name coverage.cobertura.xml -type f 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Suite '$name' passed, but no coverage.cobertura.xml was produced." >&2
            echo "Coverage directory contents:" >&2
            find "coverage/$name" -type f -print 2>/dev/null || true
            ls -R "coverage/$name" || true
            exit 1
          fi
        done <<< "$RUNS"

    - name: Upload Raw Coverage Files
      if: always() && inputs.collect-coverage == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-raw-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: |
          coverage/**/coverage.cobertura.xml
        if-no-files-found: error

    - name: Upload Test Results (TRX)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ inputs.os }}-${{ inputs.framework }}-${{ inputs.suite }}
        retention-days: 1
        path: '**/*.trx'
        if-no-files-found: warn

    - name: Fail On gRPC Cancellation Errors In Logs
      if: always()
      shell: bash
      run: |
        if grep -Ei 'gRPC method .+ (task )?canceled' test-output-*.log; then
          echo "Found gRPC cancellation errors in logs. Failing the build." >&2
          exit 1
        else
          echo "No gRPC cancellation errors detected."
        fi
