name: Build Release Outputs
description: Restore and Release-build the solution; upload bin/obj artifacts for test jobs.

inputs:
  artifact-os:
    description: Artifact name OS segment (ubuntu-latest, ubuntu-arm, windows-latest, or macos-latest).
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  run-package-smoke:
    description: When true, run the external package smoke after the build (the package-smoke job).
    required: false
    default: "false"
  analyzers:
    description: When false, build with Roslyn analyzers and code-style enforcement off. Used for the test artifact on pull requests; a separate job runs the analyzed build.
    required: false
    default: "true"
  analysis-shard:
    description: When set, an analyzed build runs analyzers only for the projects of this shard (SquirixAnalysisShard in Directory.Build.props) and compiles the rest without them. Empty analyzes every project.
    required: false
    default: ""
  upload-outputs:
    description: When false, skip the build output artifact upload (analyzer-only build).
    required: false
    default: "true"
  test-only-artifact:
    description: When true, leave the benchmark outputs, the testkit library outputs and the obj intermediates out of the artifact, because the consuming jobs run the test hosts straight from bin.
    required: false
    default: "false"
  host-runtimes-only:
    description: When true, leave the runtime-specific assets of other operating systems and CPU architectures (runtimes/<rid>/) out of the artifact. The artifact is only ever consumed on the runner kind that built it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # The build keeps its own package cache. The key other jobs share is also written by jobs that restore tools and scanners and
    # it falls back to older caches, so it grows to more than twice what a build restores. Every package version is pinned in
    # Directory.Packages.props, so that file and the SDK pin alone decide what a restore downloads. There is no fallback key on
    # purpose: a version bump restores from the feed once and saves a cache that holds only the current versions.
    - name: Cache NuGet Packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

    - name: Ensure Local Package Feed Exists
      shell: bash
      run: mkdir -p artifacts/packages

    - name: Restore
      shell: bash
      run: dotnet restore squirix.slnx

    - name: Verify Whitespace
      shell: bash
      run: git diff --check

    - name: Build
      shell: bash
      env:
        # The compiler server is a fresh process that JITs Roslyn (and the analyzers); skipping tiered-PGO instrumentation
        # makes that startup faster and does not change the build result.
        DOTNET_TieredPGO: "0"
      run: |
        if [ "${{ inputs.analyzers }}" != "true" ]; then
          # Analyzers only report diagnostics (source generators still run), so the binaries are the same and compile much faster.
          dotnet build squirix.slnx --configuration Release --no-restore -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false
        elif [ -n "${{ inputs.analysis-shard }}" ]; then
          # One shard of the analyzed build: the whole solution compiles, the projects outside the shard without analyzers.
          dotnet build squirix.slnx --configuration Release --no-restore "-p:SquirixAnalysisShard=${{ inputs.analysis-shard }}"
        else
          dotnet build squirix.slnx --configuration Release --no-restore
        fi

    # Only the package smoke needs the certificate here; every test job creates its own.
    - name: Ensure Dev HTTPS Certificate
      if: inputs.run-package-smoke == 'true'
      shell: bash
      run: bash tools/ci/ensure-dev-https-cert.sh

    - name: Run External Package Smoke
      if: inputs.run-package-smoke == 'true'
      shell: bash
      run: dotnet run --file ./tools/internal/sqr-package-smoke.cs --

    # Packages such as the code coverage extension copy native libraries for every platform into each test output
    # (about 40 MB per test project). Only the runner's own platform can load them, so the rest is dead weight in the artifact.
    # The list names foreign platforms instead of the host's own, so an unknown folder is kept rather than dropped.
    - name: Select Foreign Runtime Assets
      id: foreign-runtimes
      if: inputs.upload-outputs == 'true' && inputs.host-runtimes-only == 'true'
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) foreign=("win*" "osx*" "linux-musl*" "linux-arm*") ;;
          Linux-ARM64) foreign=("win*" "osx*" "linux-musl*" "linux-x64") ;;
          Windows-X64) foreign=("linux*" "osx*" "unix*" "win-arm*" "win-x86") ;;
          macOS-ARM64) foreign=("win*" "linux*" "osx-x64") ;;
          macOS-X64) foreign=("win*" "linux*" "osx-arm64") ;;
          *)
            echo "No foreign runtime list for ${{ runner.os }}-${{ runner.arch }}." >&2
            exit 1
            ;;
        esac
        {
          echo "excludes<<EXCLUDES"
          for rid in "${foreign[@]}"; do
            echo "!**/runtimes/${rid}/**"
          done
          echo "EXCLUDES"
        } >> "$GITHUB_OUTPUT"

    - name: Upload Build Outputs For Tests
      if: inputs.upload-outputs == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build-output-${{ inputs.artifact-os }}-${{ inputs.framework }}
        retention-days: 1
        # Level 1: the payload is mostly DLLs that barely shrink further, so the extra CPU of the default level is wasted.
        compression-level: 1
        # Jobs that run the test hosts directly do not use the benchmark outputs, the testkit library outputs (each test project
        # already carries a copy of its testkit) or the obj intermediates, so leaving them out shrinks the artifact by about a third.
        # The .pdb files stay: they give failing tests file and line numbers.
        path: |
          src/**/bin/Release/${{ inputs.framework }}/
          src/**/obj/Release/${{ inputs.framework }}/
          tests/**/bin/Release/${{ inputs.framework }}/
          tests/**/obj/Release/${{ inputs.framework }}/
          ${{ inputs.test-only-artifact != 'true' && format('benchmarks/**/bin/Release/{0}/', inputs.framework) || '' }}
          ${{ inputs.test-only-artifact != 'true' && format('benchmarks/**/obj/Release/{0}/', inputs.framework) || '' }}
          ${{ inputs.test-only-artifact == 'true' && '!tests/squirix/squirix.testkit/**' || '' }}
          ${{ inputs.test-only-artifact == 'true' && '!tests/squirix.server/squirix.server.testkit/**' || '' }}
          ${{ inputs.test-only-artifact == 'true' && '!**/obj/**' || '' }}
          ${{ steps.foreign-runtimes.outputs.excludes }}
          !**/*.xml
          !**/ref/**
          !**/*.cache
          !**/*.editorconfig*
        if-no-files-found: error
