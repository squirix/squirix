name: Build Release Outputs
description: Restore and Release-build the solution; upload the outputs the test jobs run.

inputs:
  artifact-os:
    description: Artifact name OS segment (ubuntu-latest, ubuntu-arm, windows-latest, or macos-latest).
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  analyzers:
    description: When false, build with Roslyn analyzers and code-style enforcement off. Used for the test artifact on pull requests; a separate job runs the analyzed build.
    required: false
    default: "true"
  analysis-shard:
    description: When set, an analyzed build runs analyzers only for the projects of this shard (SquirixAnalysisShard in Directory.Build.props) and compiles the rest without them. Empty analyzes every project.
    required: false
    default: ""
  upload-outputs:
    description: When false, skip the build output artifact upload (analyzer-only build).
    required: false
    default: "true"
  test-outputs-only:
    description: When true, build only the projects under src/ and tests/, whose outputs the artifact carries; the benchmarks and samples are built by the jobs that run them. Otherwise the whole solution builds.
    required: false
    default: "false"
  runtime-assets:
    description: Which runtime-specific assets (runtimes/<rid>/) the artifact keeps. `all` keeps every one; `host` keeps the runner's own platform, for an artifact only the runner kind that built it consumes; `test-runners` keeps the platforms of the test runner kinds (Linux x64 and ARM64, Windows x64, macOS ARM64).
    required: false
    default: all

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # The build keeps its own package cache. The key other jobs share is also written by jobs that restore tools and scanners and
    # it falls back to older caches, so it grows to more than twice what a build restores. Every package version is pinned in
    # Directory.Packages.props, so that file and the SDK pin alone decide what a restore downloads. There is no fallback key on
    # purpose: a version bump restores from the feed once and saves a cache that holds only the current versions.
    - name: Cache NuGet Packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES || '~/.nuget/packages' }}
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

    - name: Ensure Local Package Feed Exists
      shell: bash
      run: mkdir -p artifacts/packages

    # The reduced solution is derived from squirix.slnx, so a new project under src/ or tests/ is built without being listed anywhere.
    # Every project entry is a single line, so dropping the lines of benchmarks/ and samples/ leaves valid XML.
    - name: Select Solution
      id: solution
      shell: bash
      run: |
        if [ "${{ inputs.test-outputs-only }}" = "true" ]; then
          grep -vE '<Project Path="(benchmarks|samples)/' squirix.slnx > squirix.test-outputs.slnx
          echo "path=squirix.test-outputs.slnx" >> "$GITHUB_OUTPUT"
        else
          echo "path=squirix.slnx" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore
      shell: bash
      run: dotnet restore "${{ steps.solution.outputs.path }}"

    - name: Verify Whitespace
      shell: bash
      run: git diff --check

    - name: Build
      shell: bash
      env:
        # The compiler server is a fresh process that JITs Roslyn (and the analyzers); skipping tiered-PGO instrumentation
        # makes that startup faster and does not change the build result.
        DOTNET_TieredPGO: "0"
      run: |
        solution="${{ steps.solution.outputs.path }}"
        if [ "${{ inputs.analyzers }}" != "true" ]; then
          # Analyzers only report diagnostics (source generators still run), so the binaries are the same and compile much faster.
          dotnet build "$solution" --configuration Release --no-restore -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false
        elif [ -n "${{ inputs.analysis-shard }}" ]; then
          # One shard of the analyzed build: the whole solution compiles, the projects outside the shard without analyzers.
          dotnet build "$solution" --configuration Release --no-restore "-p:SquirixAnalysisShard=${{ inputs.analysis-shard }}"
        else
          dotnet build "$solution" --configuration Release --no-restore
        fi

    # Packages such as the code coverage extension copy native libraries for every platform into each test output
    # (about 40 MB per test project). Only the platforms the tests run on can load them, so the rest is dead weight in the artifact.
    # The list names foreign platforms instead of the host's own, so an unknown folder is kept rather than dropped.
    - name: Select Foreign Runtime Assets
      id: foreign-runtimes
      if: inputs.upload-outputs == 'true' && inputs.runtime-assets != 'all'
      shell: bash
      run: |
        case "${{ inputs.runtime-assets }}/${{ runner.os }}-${{ runner.arch }}" in
          test-runners/*) foreign=("win-arm64" "win-x86" "osx-x64" "linux-musl*" "linux-arm") ;;
          host/Linux-X64) foreign=("win*" "osx*" "linux-musl*" "linux-arm*") ;;
          host/Linux-ARM64) foreign=("win*" "osx*" "linux-musl*" "linux-x64") ;;
          host/Windows-X64) foreign=("linux*" "osx*" "unix*" "win-arm*" "win-x86") ;;
          host/macOS-ARM64) foreign=("win*" "linux*" "osx-x64") ;;
          host/macOS-X64) foreign=("win*" "linux*" "osx-arm64") ;;
          *)
            echo "No foreign runtime list for '${{ inputs.runtime-assets }}' on ${{ runner.os }}-${{ runner.arch }}." >&2
            exit 1
            ;;
        esac
        {
          echo "excludes<<EXCLUDES"
          for rid in "${foreign[@]}"; do
            echo "!**/runtimes/${rid}/**"
          done
          echo "EXCLUDES"
        } >> "$GITHUB_OUTPUT"

    - name: Upload Build Outputs For Tests
      if: inputs.upload-outputs == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build-output-${{ inputs.artifact-os }}-${{ inputs.framework }}
        retention-days: 1
        # Level 1: the payload is mostly DLLs that barely shrink further, so the extra CPU of the default level is wasted.
        compression-level: 1
        # The consumers run the hosts straight from bin: they do not use the benchmark outputs, the testkit library outputs (each
        # test project already carries a copy of its testkit) or the obj intermediates. The .pdb files stay: they give failing
        # tests file and line numbers.
        path: |
          src/**/bin/Release/${{ inputs.framework }}/
          tests/**/bin/Release/${{ inputs.framework }}/
          !tests/squirix/squirix.testkit/**
          !tests/squirix.server/squirix.server.testkit/**
          ${{ steps.foreign-runtimes.outputs.excludes }}
          !**/*.xml
          !**/ref/**
          !**/*.cache
          !**/*.editorconfig*
        if-no-files-found: error
