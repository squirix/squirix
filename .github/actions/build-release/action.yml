name: Build Release Outputs
description: Restore and Release-build the solution; upload the outputs the test jobs run.

inputs:
  artifact-os:
    description: Artifact name OS segment (ubuntu-latest, ubuntu-arm, windows-latest, or macos-latest).
    required: true
  framework:
    description: Target framework moniker.
    required: false
    default: net10.0
  analyzers:
    description: When false, build with Roslyn analyzers and code-style enforcement off. Used for the test artifact on pull requests; a separate job runs the analyzed build.
    required: false
    default: "true"
  analysis-shard:
    description: When set, an analyzed build runs analyzers only for the projects of this shard (SquirixAnalysisShard in Directory.Build.props) and compiles the rest without them. Empty analyzes every project.
    required: false
    default: ""
  upload-outputs:
    description: When false, skip the build output artifact upload (analyzer-only build).
    required: false
    default: "true"
  test-outputs-only:
    description: When true, build only the projects under src/ and tests/, whose outputs the artifact carries; the benchmarks and samples are built by the jobs that run them. Otherwise the whole solution builds.
    required: false
    default: "false"
  projects:
    description: When set, build only these projects (space-separated paths) and the projects they reference, for a job that runs their outputs itself.
    required: false
    default: ""
  net10-runtime:
    description: When true, the SDK folder also holds the .NET 10 runtimes, for a job that runs the outputs it builds (see .github/actions/setup-sdk).
    required: false
    default: "false"
  runtime-assets:
    description: Which runtime-specific assets (runtimes/<rid>/) the artifact keeps. `all` keeps every one; `host` keeps the runner's own platform, for an artifact only the runner kind that built it consumes; `test-runners` keeps the platforms of the test runner kinds (Linux x64 and ARM64, Windows x64, macOS ARM64).
    required: false
    default: all

runs:
  using: composite
  steps:
    # The SDK comes from the cache of the installed SDK; see .github/actions/setup-sdk.
    - name: Setup .NET
      uses: ./.github/actions/setup-sdk
      with:
        net10-runtime: ${{ inputs.net10-runtime }}

    # The build keeps its own package cache. The key other jobs share is also written by jobs that restore tools and scanners and
    # it falls back to older caches, so it grows to more than twice what a build restores. Every package version is pinned in
    # Directory.Packages.props, so that file and the SDK pin alone decide what a restore downloads. There is no fallback key on
    # purpose: a version bump restores from the feed once and saves a cache that holds only the current versions.
    - name: Restore NuGet Package Cache
      id: nuget-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.NUGET_PACKAGES || '~/.nuget/packages' }}
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

    - name: Ensure Local Package Feed Exists
      shell: bash
      run: mkdir -p artifacts/packages

    # Reduced solutions are derived at run time, so a new project is built without being listed anywhere.
    #  - test outputs: every project entry of squirix.slnx is a single line, so dropping those of benchmarks/ and samples/
    #    leaves valid XML;
    #  - an analysis shard: its projects, as SquirixPrintAnalysisShard (Directory.Build.props) reports them; the projects they
    #    reference build with them. The `default` shard owns every unclaimed project, so a new project lands in its list;
    #  - given projects: those projects; the projects they reference build with them.
    - name: Select Solution
      id: solution
      shell: bash
      run: |
        shard="${{ inputs.analysis-shard }}"
        if [ "${{ inputs.test-outputs-only }}" = "true" ]; then
          if [ "${{ inputs.analyzers }}" = "true" ] || [ -n "$shard" ]; then
            echo "test-outputs-only leaves benchmarks/ and samples/ out of the build, so it cannot be combined with analyzers." >&2
            exit 1
          fi
          grep -vE '<Project Path="(benchmarks|samples)/' squirix.slnx > squirix.test-outputs.slnx
          echo "path=squirix.test-outputs.slnx" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ inputs.projects }}" ]; then
          if [ -n "$shard" ] || [ "${{ inputs.upload-outputs }}" = "true" ]; then
            echo "projects builds outputs for the job itself, so it cannot be combined with an analysis shard or an upload." >&2
            exit 1
          fi
          {
            echo '<Solution>'
            for project in ${{ inputs.projects }}; do
              echo "    <Project Path=\"$project\"/>"
            done
            echo '</Solution>'
          } > squirix.projects.slnx
          cat squirix.projects.slnx
          echo "path=squirix.projects.slnx" >> "$GITHUB_OUTPUT"
        elif [ -n "$shard" ]; then
          # Written to a file first: a failing msbuild then fails the step instead of leaving a partial list. The listing must
          # also name every project of the solution, so a project that printed nothing cannot drop out unnoticed. A project
          # in several shards prints one line per shard.
          listing="$RUNNER_TEMP/analysis-shards.txt"
          dotnet msbuild squirix.slnx -t:SquirixPrintAnalysisShard -nologo -v:m > "$listing"
          listed="$(sed -n 's/^ *squirix-analysis-shard|[^|]*|//p' "$listing" | sort -u | wc -l)"
          projects="$(grep -c '<Project Path=' squirix.slnx || true)"
          if [ "$listed" -ne "$projects" ]; then
            cat "$listing"
            echo "SquirixPrintAnalysisShard reported $listed of the $projects projects in squirix.slnx." >&2
            exit 1
          fi
          mapfile -t members < <(sed -n "s/^ *squirix-analysis-shard|${shard}|//p" "$listing" | sort)
          if [ ${#members[@]} -eq 0 ]; then
            echo "No project belongs to analysis shard '$shard'." >&2
            exit 1
          fi
          {
            echo '<Solution>'
            for project in "${members[@]}"; do
              echo "    <Project Path=\"$(realpath --relative-to=. "$project")\"/>"
            done
            echo '</Solution>'
          } > squirix.analysis-shard.slnx
          cat squirix.analysis-shard.slnx
          echo "path=squirix.analysis-shard.slnx" >> "$GITHUB_OUTPUT"
        else
          echo "path=squirix.slnx" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify Whitespace
      shell: bash
      run: git diff --check

    # The build restores in the same process: a separate restore would start the SDK and evaluate every project a second time.
    - name: Restore And Build
      shell: bash
      env:
        # The compiler server is a fresh process that JITs Roslyn (and the analyzers); skipping tiered-PGO instrumentation
        # makes that startup faster and does not change the build result.
        DOTNET_TieredPGO: "0"
      run: |
        solution="${{ steps.solution.outputs.path }}"
        # MSBuild builds a referenced project that the solution does not list in Debug unless told to keep the configuration.
        keep="-p:ShouldUnsetParentConfigurationAndPlatform=false"
        if [ "${{ inputs.analyzers }}" != "true" ]; then
          # Analyzers only report diagnostics (source generators still run), so the binaries are the same and compile much faster.
          dotnet build "$solution" --configuration Release "$keep" -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false
        elif [ -n "${{ inputs.analysis-shard }}" ]; then
          # One shard of the analyzed build: the projects outside the shard compile without analyzers.
          dotnet build "$solution" --configuration Release "$keep" "-p:SquirixAnalysisShard=${{ inputs.analysis-shard }}"
        else
          dotnet build "$solution" --configuration Release "$keep"
        fi

    # Only a restore of the whole solution saves the package cache: a reduced solution restores fewer packages, and the jobs that
    # only read the cache need all of them. On ubuntu x64 no build uses the whole solution, so the `default` analysis shard
    # restores it for the cache when the cache missed, which only happens after a package or SDK change.
    - name: Restore The Whole Solution For The Package Cache
      if: steps.nuget-cache.outputs.cache-hit != 'true' && inputs.analysis-shard == 'default'
      shell: bash
      run: dotnet restore squirix.slnx

    - name: Save NuGet Package Cache
      if: steps.nuget-cache.outputs.cache-hit != 'true' && (steps.solution.outputs.path == 'squirix.slnx' || inputs.analysis-shard == 'default')
      uses: actions/cache/save@v6
      with:
        path: ${{ env.NUGET_PACKAGES || '~/.nuget/packages' }}
        key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

    # Packages such as the code coverage extension copy native libraries for every platform into each test output
    # (about 40 MB per test project). Only the platforms the tests run on can load them, so the rest is dead weight in the artifact.
    # The list names foreign platforms instead of the host's own, so an unknown folder is kept rather than dropped.
    - name: Select Foreign Runtime Assets
      id: foreign-runtimes
      if: inputs.upload-outputs == 'true' && inputs.runtime-assets != 'all'
      shell: bash
      run: |
        case "${{ inputs.runtime-assets }}/${{ runner.os }}-${{ runner.arch }}" in
          test-runners/*) foreign=("win-arm64" "win-x86" "osx-x64" "linux-musl*" "linux-arm") ;;
          host/Linux-X64) foreign=("win*" "osx*" "linux-musl*" "linux-arm*") ;;
          host/Linux-ARM64) foreign=("win*" "osx*" "linux-musl*" "linux-x64") ;;
          host/Windows-X64) foreign=("linux*" "osx*" "unix*" "win-arm*" "win-x86") ;;
          host/macOS-ARM64) foreign=("win*" "linux*" "osx-x64") ;;
          host/macOS-X64) foreign=("win*" "linux*" "osx-arm64") ;;
          *)
            echo "No foreign runtime list for '${{ inputs.runtime-assets }}' on ${{ runner.os }}-${{ runner.arch }}." >&2
            exit 1
            ;;
        esac
        {
          echo "excludes<<EXCLUDES"
          for rid in "${foreign[@]}"; do
            echo "!**/runtimes/${rid}/**"
          done
          echo "EXCLUDES"
        } >> "$GITHUB_OUTPUT"

    - name: Upload Build Outputs For Tests
      if: inputs.upload-outputs == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build-output-${{ inputs.artifact-os }}-${{ inputs.framework }}
        retention-days: 1
        # Level 1: the payload is mostly DLLs that barely shrink further, so the extra CPU of the default level is wasted.
        compression-level: 1
        # The consumers run the hosts straight from bin: they do not use the benchmark outputs, the testkit library outputs (each
        # test project already carries a copy of its testkit) or the obj intermediates. The .pdb files stay: they give failing
        # tests file and line numbers.
        path: |
          src/**/bin/Release/${{ inputs.framework }}/
          tests/**/bin/Release/${{ inputs.framework }}/
          !tests/squirix/squirix.testkit/**
          !tests/squirix.server/squirix.server.testkit/**
          ${{ steps.foreign-runtimes.outputs.excludes }}
          !**/*.xml
          !**/ref/**
          !**/*.cache
          !**/*.editorconfig*
        if-no-files-found: error
