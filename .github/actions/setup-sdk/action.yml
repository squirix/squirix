name: Setup .NET SDK
description: >-
  Put the SDK pinned in global.json on the path, restored from a cache of the installed SDK (3-6 s against 7-14 s for
  actions/setup-dotnet). The folder holds that SDK alone unless net10-runtime adds the .NET 10 runtimes that net10.0 apps
  (the tests, the samples, the benchmarks, the file-based tools) run on.

inputs:
  net10-runtime:
    description: >-
      When true, the folder also holds the .NET and ASP.NET Core 10.0 runtimes, for a job that runs net10.0 apps. They are the
      latest 10.0 patches when the cache is made, which happens again after global.json changes. Linux and macOS only.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore SDK Cache
      id: sdk-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/dotnet-sdk
        key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}${{ inputs.net10-runtime == 'true' && '-net10-runtime' || '' }}

    # A miss happens once per runner kind after global.json changes. The install goes into the cached folder, which on Windows
    # is on the work drive (the system drive takes about 40 s for the install).
    - name: Install SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-sdk
      with:
        global-json-file: global.json

    # actions/setup-dotnet installs whole SDKs only; the runtimes alone come from the official install script.
    - name: Install .NET 10 Runtimes
      if: steps.sdk-cache.outputs.cache-hit != 'true' && inputs.net10-runtime == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Windows" ]; then
          echo "net10-runtime supports Linux and macOS runners only." >&2
          exit 1
        fi
        script="${RUNNER_TEMP}/dotnet-install.sh"
        curl -sSfL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$script"
        for runtime in dotnet aspnetcore; do
          bash "$script" --channel 10.0 --runtime "$runtime" --install-dir "${RUNNER_TEMP}/dotnet-sdk" --no-path
        done

    # Jobs that miss at the same time each try to save; the first one wins and the others only log that the key exists.
    - name: Save SDK Cache
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/dotnet-sdk
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - name: Put SDK On The Path
      if: steps.sdk-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "${RUNNER_TEMP}/dotnet-sdk" >> "$GITHUB_PATH"
        echo "DOTNET_ROOT=${RUNNER_TEMP}/dotnet-sdk" >> "$GITHUB_ENV"
