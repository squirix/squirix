name: Close Linked Issue

on:
    pull_request:
        types: [ closed ]

permissions: { }

jobs:
    close-linked:
        name: Close Linked Issue
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            -   name: Close issues referenced in the PR title and body
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PR_TITLE: ${{ github.event.pull_request.title }}
                    PR_BODY: ${{ github.event.pull_request.body }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                run: |
                    issues=()

                    # [#N] at the start of the PR title, unless the body marks the PR as part of that issue ("Refs #N", "Part of #N"):
                    # a tracker closed piece by piece stays open until its last item.
                    if [[ "$PR_TITLE" =~ ^\[#([0-9]+)\] ]]; then
                        title_issue="${BASH_REMATCH[1]}"
                        partial=$(printf '%s\n' "$PR_BODY" \
                            | grep -oiE '\b(refs?|part of):?[[:space:]]+#[0-9]+([[:space:]]*(,|and)[[:space:]]*#[0-9]+)*' \
                            | grep -oE '[0-9]+' || true)
                        if printf '%s\n' "$partial" | grep -qx "$title_issue"; then
                            echo "PR body marks #$title_issue as a partial reference; not closing it from the title."
                        else
                            issues+=("$title_issue")
                        fi
                    fi

                    # GitHub closing keywords in the PR body (close/fix/resolve and their forms) followed by a same-repository #N.
                    # Keyword closing does not run for merges into a non-default branch, so the workflow closes these itself.
                    while IFS= read -r number; do
                        issues+=("$number")
                    done < <(printf '%s\n' "$PR_BODY" \
                        | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+\b' \
                        | grep -oE '[0-9]+$' || true)

                    if [[ ${#issues[@]} -eq 0 ]]; then
                        echo "No issue to close from the PR title or a closing keyword in the PR body."
                        exit 0
                    fi

                    for issue in $(printf '%s\n' "${issues[@]}" | sort -un); do
                        state=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo MISSING)
                        if [[ "$state" != "OPEN" ]]; then
                            echo "Issue #$issue is $state; skipping."
                            continue
                        fi
                        gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                            --comment "Closed automatically with merged PR #${PR_NUMBER}."
                    done
