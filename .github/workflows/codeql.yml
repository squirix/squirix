name: CodeQL

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    packages: read
    actions: read
    contents: read

jobs:
    changes:
        name: Detect Code Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Paths Filter
                uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
                id: filter
                with:
                    filters: |
                        code:
                          - 'src/**'
                          - 'tests/**'
                          - 'tools/**'
                          - 'build/**'
                          - 'examples/**'
                          - 'benchmarks/**'
                          - 'samples/**'
                          - '.github/workflows/**'
                          - '.github/actions/**'
                          - '.github/codeql/**'
                          - 'Directory.Build.props'
                          - 'Directory.Packages.props'
                          - 'global.json'
                          - 'stylecop.json'
                          - '.editorconfig'
                          - 'squirix.slnx'
                          - 'squirix.slnx.DotSettings'
                          - 'coverlet.runsettings'
                          - 'clean-bin-obj.bat'
                          - 'clean-bin-obj.sh'
                          # NDepend project/rules edits must not trigger CodeQL analyze.
                          - '!**/*.ndproj'
                          - '!**/*.ndrules'

    analyze:
        name: Analyze C#
        runs-on: ubuntu-latest
        needs: changes
        if: |
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        permissions:
            # Required by the Upload SARIF step (github/codeql-action/upload-sarif).
            security-events: write
            packages: read
            actions: read
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: csharp
                    build-mode: none
                    config-file: ./.github/codeql/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    output: sarif-results
                    upload: false

            -   name: Filter generated paths from SARIF
                uses: advanced-security/filter-sarif@f3b8118a9349d88f7b1c0c488476411145b6270d # v1
                with:
                    patterns: |
                        -**/*.g.cs
                        -**/obj/**
                        -**/bin/**
                    input: sarif-results/csharp.sarif
                    output: sarif-results/csharp.sarif

            -   name: Upload SARIF
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: sarif-results/csharp.sarif
                    category: /language:csharp
