name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      packageVersion:
        description: "Package version to validate, for example 0.1.0-preview."
        required: true
        type: string
      includeIntegrationTests:
        description: "Run the full integration test suite in addition to selected stress checks."
        required: false
        default: false
        type: boolean

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-quality: preview
          global-json-file: global.json

      - name: Verify .NET 10 baseline
        run: dotnet run --file ./tools/internal/sqr-net10-verify.cs --

      - name: Ensure Dev HTTPS Certificate
        shell: bash
        run: bash tools/ci/ensure-dev-https-cert.sh

      - name: Validate release dry run
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
          INCLUDE_INTEGRATION_TESTS: ${{ inputs.includeIntegrationTests }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${PACKAGE_VERSION#v}"
          fi

          arguments=(
            "-ArtifactsDirectory"
            "out"
            "-PackageVersion"
            "$version"
            "-IncludeStressChecks"
          )

          if [ "$INCLUDE_INTEGRATION_TESTS" = "true" ]; then
            arguments+=("-IncludeIntegrationTests")
          fi

          dotnet run --file ./tools/internal/sqr-release-validate.cs -- "${arguments[@]}"

      - name: Pack standalone server tool
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${PACKAGE_VERSION#v}"
          fi

          dotnet clean src/squirix.server.host/Squirix.Server.Host.csproj --configuration Release
          dotnet pack src/squirix.server.host/Squirix.Server.Host.csproj --configuration Release --output out/packages -p:SquirixPackageVersion="$version"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: |
            out/packages/*.nupkg
            out/packages/*.snupkg

      - name: Publish packages to nuget.org
        if: github.event_name == 'push'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          push_nuget_artifact() {
            local artifact="$1"
            local output=""
            local exit_code=0

            set +e
            output="$(dotnet nuget push "${artifact}" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1)"
            exit_code=$?
            set -e

            echo "${output}"
            if [ "${exit_code}" -eq 0 ]; then
              return 0
            fi

            if echo "${output}" | grep -Eiq 'already exists|Conflict|\(409\)'; then
              echo "NuGet artifact already exists, continuing: ${artifact}"
              return 0
            fi

            return "${exit_code}"
          }

          for package_id in squirix squirix.server squirix.server.tool; do
            pkg="out/packages/${package_id}.${version}.nupkg"
            symbol_pkg="out/packages/${package_id}.${version}.snupkg"
            if [ ! -f "${pkg}" ]; then
              echo "Expected package not found: ${pkg}" >&2
              ls -la out/packages/ >&2 || true
              exit 1
            fi
            push_nuget_artifact "${pkg}"
            if [ -f "${symbol_pkg}" ]; then
              push_nuget_artifact "${symbol_pkg}"
            fi
          done

      - name: Publish standalone server host
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${PACKAGE_VERSION#v}"
          fi

          dotnet publish src/squirix.server.host/Squirix.Server.Host.csproj --configuration Release --output out/server-host -p:SquirixPackageVersion="$version"
          cd out/server-host
          zip -r "../squirix.server.host-${version}.zip" .

      - name: Upload standalone server host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: squirix-server-host
          path: out/squirix.server.host-*.zip

      - name: Request draft release notes
        if: github.event_name == 'push'
        id: release-notes
        env:
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          new_tag="v${version}"
          prev_tag="$(git describe --tags --abbrev=0 "${new_tag}^" 2>/dev/null || true)"
          if [ -z "${prev_tag}" ]; then
            prev_tag="$(git tag --merged "${new_tag}" --sort=-v:refname 2>/dev/null | grep -Fxv -- "${new_tag}" | head -n 1 || true)"
          fi
          if [ -z "${prev_tag}" ]; then
            prev_tag="$(git tag --sort=-v:refname | grep -Fxv -- "${new_tag}" | head -n 1 || true)"
          fi
          if [ -z "${prev_tag}" ]; then
            echo "No previous tag found; using ${new_tag} as the range start." >&2
            prev_tag="${new_tag}"
          fi
          echo "Requesting draft release notes for ${prev_tag}...${new_tag}"
          notes="out/release-notes-${version}.md"
          mkdir -p out
          if ! python3 tools/ci/request_release_notes.py \
            --notes-repo squirix/release-notes \
            --project "${REPO#*/}" \
            --source-repo "${REPO}" \
            --base-branch develop \
            --new-tag "${new_tag}" \
            --prev-tag "${prev_tag}" \
            --version "${version}" \
            --workflow generate.yml \
            --client-run "${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "${notes}"; then
            echo "::warning::request_release_notes.py failed; writing minimal fallback." >&2
            printf '## Summary\n\nTODO: describe what shipped and why in 1-3 sentences.\n' > "${notes}"
          fi
          if [ ! -s "${notes}" ]; then
            echo "::warning::notes output missing or empty; writing minimal fallback." >&2
            printf '## Summary\n\nTODO: describe what shipped and why in 1-3 sentences.\n' > "${notes}"
          fi
          echo "file=${notes}" >> "${GITHUB_OUTPUT}"

      - name: Upload draft release notes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-draft
          path: out/release-notes-*.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: ${{ steps.release-notes.outputs.file }}
          files: |
            out/packages/*.nupkg
            out/packages/*.snupkg
            out/squirix.server.host-*.zip
            out/release-notes-*.md
