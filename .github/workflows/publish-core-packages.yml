name: Publish core packages

on:
    workflow_dispatch:
        inputs:
            packageVersion:
                description: Prerelease package version
                required: true
                default: 0.1.0-preview.7
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
                with:
                    global-json-file: global.json

            -   name: Build core packages
                env:
                    PACKAGE_VERSION: ${{ inputs.packageVersion }}
                run: |
                    dotnet build src/squirix/Squirix.csproj --configuration Release -p:SquirixPackageVersion="$PACKAGE_VERSION"
                    dotnet build src/squirix.server/Squirix.Server.csproj --configuration Release -p:SquirixPackageVersion="$PACKAGE_VERSION"

            -   name: Pack core packages
                env:
                    PACKAGE_VERSION: ${{ inputs.packageVersion }}
                run: |
                    dotnet pack src/squirix/Squirix.csproj --configuration Release --no-build --output artifacts/packages -p:SquirixPackageVersion="$PACKAGE_VERSION"
                    dotnet pack src/squirix.server/Squirix.Server.csproj --configuration Release --no-build --output artifacts/packages -p:SquirixPackageVersion="$PACKAGE_VERSION"

            -   name: Publish core packages
                env:
                    NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    shopt -s nullglob
                    packages=(artifacts/packages/*.nupkg)
                    if [[ ${#packages[@]} -eq 0 ]]; then
                      echo "No .nupkg files found under artifacts/packages" >&2
                      exit 1
                    fi
                    for package in "${packages[@]}"; do
                      dotnet nuget push "$package" \
                        --api-key "$NUGET_AUTH_TOKEN" \
                        --source "https://nuget.pkg.github.com/squirix/index.json" \
                        --skip-duplicate
                    done
