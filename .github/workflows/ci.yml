name: CI

on:
    # Pull requests run the ubuntu-only fast path: x64 build and tests (smoke included) without
    # coverage, SonarCloud, NDepend, ARM, format, discovery, explorer, or benchmarks.
    # On every event the test artifacts are built without analyzers; the analyzed build runs in parallel as the
    # analyze-ubuntu shards and gates ci-success.
    # Push to develop/main, weekly schedule, and manual dispatch run the full matrix.
    # Windows/macOS builds/tests run on pushes to main and develop, on pull requests into main, and on schedule/dispatch, not on
    # pull requests into develop. They run the test hosts directly.
    # Builds/tests are split per OS so ubuntu tests/Sonar are not gated on Windows/macOS build.
    # Weekly schedule also runs stability-stress (resiliency repeat + E2E Suite=Stress).
    # SonarCloud (OSS): same-repo code changes; requires secrets.SONAR_TOKEN + SonarCloud project.
    # PVS-Studio (Team): same-repo code changes; requires secrets.PVS_STUDIO_CREDENTIALS ("name key").
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    # Weekly full cross-OS run (same test matrix as manual dispatch).
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
            docs: ${{ steps.filter.outputs.docs }}
            docker: ${{ steps.filter.outputs.docker }}
            ndepend: ${{ steps.filter.outputs.ndepend }}
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Detect Changes
                id: filter
                uses: ./.github/actions/detect-changes

    markdownlint:
        name: Documentation Lint (Markdownlint)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: changes
        if: |
            needs.changes.outputs.docs == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Markdownlint
                uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
                with:
                    config: .markdownlint-cli2.jsonc

    # dotnet format is slow; run it once on the cheapest runner instead of every matrix cell.
    # PR fast path: skipped on pull_request; push, schedule, and workflow_dispatch check the full solution.
    verify-coding-conventions:
        name: Verify Coding Conventions (.editorconfig)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: changes
        if: |
            github.event_name != 'pull_request' && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            # The package cache is the one the build jobs write (see .github/actions/build-release) and is only read here. This job
            # used to keep a cache of its own under a key that fell back to older caches: every copy grew to three times what a
            # restore needs, and the copies filled the cache quota of the repository.
            -   name: Restore NuGet Package Cache
                uses: actions/cache/restore@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

            -   name: Restore
                run: dotnet restore squirix.slnx

            -   name: Verify .NET 10 Baseline
                run: dotnet run --file ./tools/internal/sqr-net10-verify.cs --

            # SquirixToolCheck keeps the analyzers on the tool files and off the projects they reference; see Directory.Build.props.
            -   name: Verify File-Based Durability Tools (sqr-*.cs)
                env:
                    SquirixToolCheck: "true"
                run: dotnet run --file ./tools/internal/sqr-tools-verify.cs --

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Verify File-Based Examples
                env:
                    SquirixToolCheck: "true"
                run: dotnet run --file ./tools/internal/sqr-examples-verify.cs --

            -   name: Verify Coding Conventions (.editorconfig)
                shell: bash
                run: bash tools/ci/verify-dotnet-format.sh

    # Pull requests: fail when changed text files are committed with CRLF (LF required by .editorconfig).
    verify-line-endings:
        name: Verify Line Endings (LF)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event_name == 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Verify Line Endings In Changed Files
                shell: bash
                run: bash tools/ci/verify-line-endings.sh

    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: changes
        if: |
            needs.changes.outputs.docker == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set Up Docker Buildx
                uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            -   name: Build Image
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
                with:
                    context: .
                    file: docker/Dockerfile
                    push: false
                    tags: squirix-server:ci
                    cache-from: type=gha
                    # A cache written by a pull request run is visible only to that pull request, and exporting it costs
                    # 7-45 s per run. Pull requests read the layers that develop and main write and export nothing.
                    cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

    # Per-OS builds so ubuntu consumers are not blocked on Windows/macOS restore+build.
    # Keep display names identical to the former matrix jobs for branch-protection continuity.
    # The ubuntu build heads the longest job chain, so it does not wait for the Detect Changes job: it starts with the
    # workflow, classifies the change set itself with the same action and skips the build when no code changed. A build
    # that had nothing to do still ends as a success, so the jobs that consume its artifact check the `built` output.
    build-ubuntu:
        name: Build (ubuntu-latest / net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        outputs:
            built: ${{ steps.gate.outputs.build }}
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Detect Changes
                id: changes
                uses: ./.github/actions/detect-changes

            -   name: Decide Whether To Build
                id: gate
                run: echo "build=${{ steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            -   name: Build Release Outputs
                if: steps.gate.outputs.build == 'true'
                uses: ./.github/actions/build-release
                with:
                    artifact-os: ubuntu-latest
                    framework: net10.0
                    # The test artifact is built without analyzers; analyze-ubuntu runs the analyzed build in parallel.
                    analyzers: "false"
                    # Nothing downloads the benchmark or sample outputs: the guard and package smoke jobs build their own.
                    test-outputs-only: "true"
                    # Pull requests into develop run only the ubuntu tests; every other run also tests on ARM, Windows and macOS.
                    runtime-assets: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && 'host' || 'test-runners' }}

    # Packs the client and server packages and runs the sample against them. It has a runner of its own so the jobs
    # that wait for the build outputs of build-ubuntu do not wait for it too.
    package-smoke:
        name: Package Smoke (Ubuntu / Net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: changes
        # PR fast path: the package smoke runs on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            # The smoke restores into a package folder of its own, so the package cache of the build jobs is of no use here.
            # `dotnet pack` builds only the two packaged projects. SquirixToolCheck builds them without analyzers, which the
            # analysis shards already run on them (and on the sample); see Directory.Build.props.
            -   name: Run External Package Smoke
                env:
                    SquirixToolCheck: "true"
                run: dotnet run --file ./tools/internal/sqr-package-smoke.cs --

    # The analyzed (TreatWarningsAsErrors) build that build-ubuntu skips for speed. It uploads nothing.
    # Like build-ubuntu it starts with the workflow and classifies the change set itself.
    # Analyzers run inside each project's compilation and the projects depend on each other in a chain, so one runner
    # cannot spread the work. Each shard therefore gets a runner of its own and analyzes only its own projects; together the
    # shards analyze every project exactly once. The `default` shard compiles the whole solution, the others only their own
    # projects and what those reference (see .github/actions/build-release).
    analyze-ubuntu:
        name: Analyze (ubuntu-latest / net10.0 / ${{ matrix.shard }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                # One entry per shard in SquirixAnalysisShards (Directory.Build.props); a shard missing here is never analyzed.
                shard: [ default, server-unit-tests, server-tests ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Detect Changes
                id: changes
                uses: ./.github/actions/detect-changes

            -   name: Decide Whether To Analyze
                id: gate
                run: echo "analyze=${{ steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            -   name: Analyzed Release Build
                if: steps.gate.outputs.analyze == 'true'
                uses: ./.github/actions/build-release
                with:
                    artifact-os: ubuntu-latest
                    framework: net10.0
                    analysis-shard: ${{ matrix.shard }}
                    upload-outputs: "false"

            # Together the shards analyze every project exactly once. The checks read the shard listing the build of a shard other
            # than `default` wrote (see .github/actions/build-release), so they cost no further MSBuild run.
            #  - The build fails on a shard name Directory.Build.props does not declare, so an equal count means the matrix above
            #    and the declared shards are the same set and no declared shard is left without a job.
            #  - Every project of the repository is in squirix.slnx, which the shard listing is taken from.
            #  - Every project belongs to a declared shard.
            -   name: Verify Every Project Is Analyzed Once
                if: steps.gate.outputs.analyze == 'true' && matrix.shard != 'default'
                shell: bash
                run: |
                    listing="$RUNNER_TEMP/analysis-shards.txt"
                    declared="$(sed -n 's/^ *squirix-analysis-shards|//p' "$listing" | head -n 1)"
                    IFS=';' read -r -a shards <<< "$declared"
                    if [ "${#shards[@]}" -ne "${{ strategy.job-total }}" ]; then
                      echo "Directory.Build.props declares ${#shards[@]} analysis shards ($declared) but this job runs ${{ strategy.job-total }}." >&2
                      exit 1
                    fi

                    missing="$(comm -23 <(git ls-files '*.csproj' | sort) <(sed -n 's/.*<Project Path="\([^"]*\)".*/\1/p' squirix.slnx | sort))"
                    if [ -n "$missing" ]; then
                      echo "Not in squirix.slnx, so no analysis shard builds them: $missing" >&2
                      exit 1
                    fi

                    undeclared="$(sed -n 's/^ *squirix-analysis-shard|\([^|]*\)|.*/\1/p' "$listing" | sort -u | grep -vxF -f <(printf '%s\n' "${shards[@]}") || true)"
                    if [ -n "$undeclared" ]; then
                      echo "Projects belong to shards Directory.Build.props does not declare, so no job analyzes them: $undeclared" >&2
                      exit 1
                    fi

    build-windows:
        name: Build (windows-latest / net10.0)
        runs-on: windows-latest
        timeout-minutes: 45
        # Heads the Windows chain, which ends push runs, so like build-ubuntu it classifies the change set itself instead of
        # waiting for the Detect Changes job.
        if: |
            github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/develop' || github.base_ref == 'main'
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            # On Windows actions/checkout spends 10-15 s setting up and removing credentials and, after the job, running
            # `git submodule foreach`. The repository is public, so a shallow fetch of the commit needs neither (a private
            # repository would need actions/checkout back).
            -   name: Checkout
                shell: bash
                run: |
                    git init -q .
                    git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
                    # Three attempts, like actions/checkout.
                    for attempt in 1 2 3; do
                      git fetch -q --depth=1 --no-tags origin "${GITHUB_SHA}" && break
                      [ "$attempt" -eq 3 ] && exit 1
                      sleep 5
                    done
                    git checkout -q --detach FETCH_HEAD

            -   name: Detect Changes
                id: changes
                uses: ./.github/actions/detect-changes

            -   name: Decide Whether To Build
                id: gate
                run: echo "build=${{ steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            # The system drive of the runner is slow: installing the SDK there takes about 40 s, and unpacking the package cache 35 s.
            -   name: Install .NET And Packages On The Work Drive
                if: steps.gate.outputs.build == 'true'
                shell: bash
                run: |
                    echo "DOTNET_INSTALL_DIR=${RUNNER_TEMP}\\dotnet" >> "$GITHUB_ENV"
                    echo "NUGET_PACKAGES=${RUNNER_TEMP}\\nuget-packages" >> "$GITHUB_ENV"

            -   name: Build Release Outputs
                if: steps.gate.outputs.build == 'true'
                uses: ./.github/actions/build-release
                with:
                    artifact-os: windows-latest
                    framework: net10.0
                    # The analyze-ubuntu shards run the analyzers; here only compiling matters.
                    analyzers: "false"
                    # This job proves that the solution builds on this system. The tests of every runner kind run on the outputs
                    # of build-ubuntu, so nothing is uploaded here.
                    upload-outputs: "false"

    build-macos:
        name: Build (macos-latest / net10.0)
        runs-on: macos-latest
        timeout-minutes: 45
        # Heads the macOS chain, which ends push runs right after the Windows one, so like build-ubuntu it classifies the change set itself instead of
        # waiting for the Detect Changes job.
        if: |
            github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/develop' || github.base_ref == 'main'
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Detect Changes
                id: changes
                uses: ./.github/actions/detect-changes

            -   name: Decide Whether To Build
                id: gate
                run: echo "build=${{ steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            -   name: Build Release Outputs
                if: steps.gate.outputs.build == 'true'
                uses: ./.github/actions/build-release
                with:
                    artifact-os: macos-latest
                    framework: net10.0
                    # The analyze-ubuntu shards run the analyzers; here only compiling matters.
                    analyzers: "false"
                    # This job proves that the solution builds on this system. The tests of every runner kind run on the outputs
                    # of build-ubuntu, so nothing is uploaded here.
                    upload-outputs: "false"

    build-arm:
        name: Build (ubuntu-26.04-arm / net10.0)
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 60
        needs: changes
        # PR fast path: ARM build runs on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Build Release Outputs
                uses: ./.github/actions/build-release
                with:
                    artifact-os: ubuntu-arm
                    framework: net10.0
                    # The analyze-ubuntu shards run the analyzers; here only compiling matters.
                    analyzers: "false"
                    # This job proves that the solution builds on this system. The tests of every runner kind run on the outputs
                    # of build-ubuntu, so nothing is uploaded here.
                    upload-outputs: "false"

    # Per-OS test matrices: each starts as soon as its build finishes; ubuntu also runs the smoke suite.
    test-ubuntu:
        name: Test (ubuntu-latest / net10.0 / ${{ matrix.suite }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [ build-ubuntu ]
        if: needs.build-ubuntu.outputs.built == 'true'
        strategy:
            fail-fast: false
            max-parallel: 8
            matrix:
                # The organization runs at most 20 jobs at a time, and a run that asks for more leaves jobs waiting for a runner.
                # Starting a job also takes about as long as a suite runs. So the suites share three jobs of similar length;
                # the groups are defined in tools/ci/select-test-suite.py.
                suite: [ light, server-unit-e2e, server-integration ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: ubuntu-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    # PR fast path: no coverage on pull_request.
                    collect-coverage: ${{ github.event_name != 'pull_request' }}

    test-windows:
        name: Test (windows-latest / net10.0 / ${{ matrix.suite }})
        runs-on: windows-latest
        timeout-minutes: 20
        # The tests run on the outputs of build-ubuntu. They also wait for the build on their own runner kind: a system that
        # cannot build the solution is not tested, and the wait spreads the test jobs over time, so the ubuntu tests, which
        # SonarCloud and the coverage report wait for, get their runners first under the 20 job limit of the organization.
        needs: [ build-ubuntu, build-windows ]
        if: |
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main') &&
            needs.build-ubuntu.outputs.built == 'true'
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 6
            matrix:
                # Two jobs of similar length; see test-ubuntu.
                suite: [ desktop-integration, server-unit-e2e ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            # A shallow fetch instead of actions/checkout; see build-windows.
            -   name: Checkout
                shell: bash
                run: |
                    git init -q .
                    git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
                    # Three attempts, like actions/checkout.
                    for attempt in 1 2 3; do
                      git fetch -q --depth=1 --no-tags origin "${GITHUB_SHA}" && break
                      [ "$attempt" -eq 3 ] && exit 1
                      sleep 5
                    done
                    git checkout -q --detach FETCH_HEAD

            # Tests create their storage under the temp folder. The default one sits on the system drive, where a flush
            # takes 3-16 ms; on the work drive it takes 0.1-0.3 ms, which matters to every test that waits for durability.
            -   name: Use The Runner Temp Folder
                shell: bash
                run: |
                    echo "TEMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"
                    echo "TMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: windows-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "false"

    test-macos:
        name: Test (macos-latest / net10.0 / ${{ matrix.suite }})
        runs-on: macos-latest
        timeout-minutes: 20
        # Waits for the build on its own runner kind as well; see test-windows.
        needs: [ build-ubuntu, build-macos ]
        if: |
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main') &&
            needs.build-ubuntu.outputs.built == 'true'
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 6
            matrix:
                # Two jobs of similar length; see test-ubuntu.
                suite: [ desktop-integration, server-unit-e2e ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: macos-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "false"

    test-arm:
        name: Test (ubuntu-26.04-arm / net10.0 / ${{ matrix.suite }})
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 30
        # Waits for the build on its own runner kind as well; see test-windows.
        needs: [ build-ubuntu, build-arm ]
        # PR fast path: ARM tests run on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' && needs.build-ubuntu.outputs.built == 'true'
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 2
            matrix:
                # ARM repeats the ubuntu suites on a second architecture and nothing waits for it, so its suites run back to
                # back in two jobs (the `arm-client` and `arm-server` groups) and leave the job slots to the other runners.
                suite: [ arm-client, arm-server ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: ubuntu-arm
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "false"

    # Two short checks of the ubuntu build outputs in one job, so they hold one of the 20 job slots of the organization
    # plan. A check runs even when the other one failed, so one run reports every failure.
    #  - test discovery: every test project lists at least one test;
    #  - protocol model explorer, full profile: the safe run plus three required broken-rule counterexamples.
    post-build-checks:
        name: Post-Build Checks (Ubuntu / Net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        needs: [ build-ubuntu ]
        # PR fast path: these checks run on push/schedule/dispatch only.
        if: github.event_name != 'pull_request' && needs.build-ubuntu.outputs.built == 'true'
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            # The checks below run the built hosts on the .NET 10 runtime of the runner image; only the benchmarks need the SDK.
            -   name: Download Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-output-ubuntu-latest-net10.0
                    path: .

            # The hosts list their tests in parallel; each output goes to a file of its own and is printed in order.
            -   name: Verify Test Discovery Per Project (Fail On Zero Tests)
                shell: bash
                run: |
                    set -euo pipefail

                    mapfile -d '' -t test_projects < <(git ls-files -z '*Tests.csproj')
                    if [ ${#test_projects[@]} -eq 0 ]; then
                      echo "No test projects found (*Tests.csproj)." >&2
                      exit 1
                    fi

                    out_dir="$(mktemp -d)"
                    pids=()
                    for i in "${!test_projects[@]}"; do
                      proj="${test_projects[$i]}"
                      host="$(dirname "$proj")/bin/Release/net10.0/$(basename "$proj" .csproj).dll"
                      dotnet "$host" --list-tests --timeout 5m > "$out_dir/$i.log" 2>&1 &
                      pids+=("$!")
                    done

                    failed=0
                    for i in "${!test_projects[@]}"; do
                      proj="${test_projects[$i]}"
                      code=0
                      wait "${pids[$i]}" || code=$?
                      count="$(grep -oE 'found [0-9]+ test' "$out_dir/$i.log" | grep -oE '[0-9]+' | head -1 || true)"
                      if [ "$code" -ne 0 ] || [ "${count:-0}" -le 0 ]; then
                        cat "$out_dir/$i.log"
                        echo "No tests discovered in $proj (exit=$code)." >&2
                        failed=1
                      else
                        echo "Discovered $count tests in $proj"
                      fi
                    done
                    exit "$failed"

            # The four cases run in parallel; each output goes to a file of its own and is printed in order.
            -   name: Run Full-Profile Explorer
                if: ${{ !cancelled() }}
                shell: bash
                run: |
                    set -euo pipefail
                    EXE="src/squirix.protocol-model/bin/Release/net10.0/Squirix.ProtocolModel.dll"
                    OUT_ROOT="artifacts/protocol-model-explorer"
                    mkdir -p "$OUT_ROOT"

                    run_case() {
                      local broken="$1"
                      local expect_invariant="$2"
                      local out="$OUT_ROOT/$broken"
                      mkdir -p "$out"
                      set +e
                      dotnet "$EXE" --profile full --output "$out" --broken "$broken"
                      local code=$?
                      set -e
                      if [[ -z "$expect_invariant" ]]; then
                        # 0 = fixed point; 4 = MaxStates truncation without violation (documented residual risk).
                        if [[ "$code" -ne 0 && "$code" -ne 4 ]]; then
                          echo "Explorer exited $code for --broken $broken (expected 0 or 4)." >&2
                          cat "$out/summary.json" 2>/dev/null || true
                          return 1
                        fi
                      elif [[ "$code" -ne 0 ]]; then
                        echo "Explorer exited $code for --broken $broken (expected 0)." >&2
                        cat "$out/summary.json" 2>/dev/null || true
                        return 1
                      fi
                      if [[ ! -f "$out/summary.json" ]]; then
                        echo "Missing summary.json for --broken $broken." >&2
                        return 1
                      fi
                      cat "$out/summary.json"
                      if [[ -z "$expect_invariant" ]]; then
                        if grep -Eq '"violation"[[:space:]]*:[[:space:]]*null' "$out/summary.json"; then
                          echo "OK safe full profile: no violation (exit=$code)"
                          return 0
                        fi
                        echo "Safe full profile expected violation:null." >&2
                        return 1
                      fi
                      if grep -Fq "\"invariant\":\"$expect_invariant\"" "$out/summary.json"; then
                        echo "OK broken=$broken invariant=$expect_invariant"
                        return 0
                      fi
                      echo "Broken mode $broken expected invariant $expect_invariant." >&2
                      return 1
                    }

                    cases=( "none:" "vote:ElectionSafety" "current-term-commit:CurrentTermCommit" "read-index:ReadIndex" )
                    pids=()
                    for c in "${cases[@]}"; do
                      run_case "${c%%:*}" "${c#*:}" > "$OUT_ROOT/${c%%:*}.log" 2>&1 &
                      pids+=("$!")
                    done

                    failed=0
                    for i in "${!cases[@]}"; do
                      broken="${cases[$i]%%:*}"
                      code=0
                      wait "${pids[$i]}" || code=$?
                      echo "::group::explorer broken=$broken"
                      cat "$OUT_ROOT/$broken.log"
                      echo "::endgroup::"
                      if [ "$code" -ne 0 ]; then
                        echo "Explorer case $broken failed." >&2
                        failed=1
                      fi
                    done
                    exit "$failed"

            -   name: Upload Explorer Summaries
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: protocol-model-explorer-summaries
                    retention-days: 7
                    path: artifacts/protocol-model-explorer/**
                    if-no-files-found: warn

    # Guards the allocations of the gRPC wire path: GetValue and Set for a scalar and a structured value, ephemeral and
    # persistent (8 cases of the 52-row matrix in docs/benchmarks/e2e-benchmarks.md). Allocated bytes per operation barely
    # move between runs, unlike times on a shared runner, so they are compared with a baseline measured on this runner
    # kind; see tools/ci/check-wire-alloc.py. The job builds the benchmarks itself and, like build-ubuntu, classifies the
    # change set itself, so it starts with the workflow instead of after the Detect Changes job.
    wire-alloc-guard:
        name: Wire Allocation Guard (Ubuntu / Net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # The guard covers develop: its pushes, pull requests into it, schedule and dispatch.
        if: |
            github.ref == 'refs/heads/develop' || github.base_ref == 'develop' ||
            github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
            BDN_ARTIFACTS: ${{ github.workspace }}/BenchmarkDotNet.Artifacts
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Detect Changes
                id: changes
                uses: ./.github/actions/detect-changes

            -   name: Decide Whether To Guard
                id: gate
                run: echo "guard=${{ steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            -   name: Setup .NET
                if: steps.gate.outputs.guard == 'true'
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            # Reads the package cache of the build jobs; see verify-coding-conventions.
            -   name: Restore NuGet Package Cache
                if: steps.gate.outputs.guard == 'true'
                uses: actions/cache/restore@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

            # Analyzers only report diagnostics, and the analysis shards run them on these projects.
            -   name: Build E2E Benchmarks
                if: steps.gate.outputs.guard == 'true'
                run: dotnet build benchmarks/squirix.e2e.benchmarks/Squirix.E2EBenchmarks.csproj --configuration Release -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false

            -   name: Ensure Dev HTTPS Certificate
                if: steps.gate.outputs.guard == 'true'
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            # Each filter is a glob of its own: BenchmarkDotNet does not split one argument at '|'.
            # iterationCount 3: MinIterationTime(150) often yields empty rows at 1.
            # In process, BenchmarkDotNet does not build a project of its own (about 110 s here, since it recompiled the
            # benchmarks with analyzers) or start a process per case.
            -   name: Run Wire Allocation Benchmarks
                if: steps.gate.outputs.guard == 'true'
                shell: bash
                env:
                    SQUIRIX_E2E_BENCHMARK_IN_PROCESS: "1"
                run: |
                    set -o pipefail
                    mkdir -p "$BDN_ARTIFACTS"
                    dotnet run --project benchmarks/squirix.e2e.benchmarks/Squirix.E2EBenchmarks.csproj \
                      --configuration Release \
                      --no-build \
                      -- \
                      --filter '*Wire*AllocBenchmarks.GetValueAsync' '*Wire*AllocBenchmarks.SetAsync' \
                      --warmupCount 1 \
                      --iterationCount 3 \
                      --exporters json \
                      --artifacts "$BDN_ARTIFACTS" 2>&1 | tee benchmark-wire-alloc.log

            # BenchmarkDotNet exits 0 when a case fails or the filter selects nothing, so the check also fails on a missing result.
            -   name: Compare Allocations With The Baseline
                if: ${{ !cancelled() && steps.gate.outputs.guard == 'true' }}
                run: python3 tools/ci/check-wire-alloc.py benchmarks/squirix.e2e.benchmarks/wire-alloc-ci-baseline.json "$BDN_ARTIFACTS"

            -   name: Upload Benchmark Artifacts
                if: ${{ always() && steps.gate.outputs.guard == 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: benchmarks-wire-alloc
                    retention-days: 7
                    path: |
                        BenchmarkDotNet.Artifacts/**
                        benchmark-wire-alloc.log
                    if-no-files-found: warn

    coverage:
        name: Coverage Report
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # The report reads only the coverage of the ubuntu tests, so it waits neither for the conventions check nor for the post-build checks.
        needs: [ changes, markdownlint, test-ubuntu ]
        # PR fast path: coverage report runs on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' &&
            always() &&
            needs.markdownlint.result != 'failure' &&
            (needs.changes.outputs.code == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')
        env:
            COVERAGE_MIN_LINE_RATE: "0.70"
        steps:
            -   name: Download Raw Coverage Files
                uses: actions/download-artifact@v8
                with:
                    pattern: coverage-raw-net10.0-*
                    merge-multiple: true
                    path: coverage

            -   name: Check Coverage Files Exist
                id: covcheck
                shell: bash
                run: |
                    mapfile -t files < <(find coverage -name coverage.cobertura.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                        echo "No coverage files found." >&2
                        find coverage -type f -print 2>/dev/null || true
                        exit 1
                    fi

                    echo "found=true" >> "$GITHUB_OUTPUT"

            # One ReportGenerator run writes the merged Cobertura file the gate reads and the report that is uploaded.
            -   name: Merge Coverage Reports
                if: steps.covcheck.outputs.found == 'true'
                uses: danielpalme/ReportGenerator-GitHub-Action@a003c8fb9ac008fd0fffd5faa4f7d3ecb52e0675
                with:
                    reports: coverage/**/coverage.cobertura.xml
                    targetdir: coverage/report
                    reporttypes: HtmlInline;Cobertura;TextSummary
                    assemblyfilters: '+Squirix;+Squirix.Server;-Squirix.TestKit;-Squirix.Server.TestKit'
                    classfilters: '+*;-JetBrains.Annotations.*'

            -   name: Enforce Coverage Gate
                if: steps.covcheck.outputs.found == 'true'
                shell: pwsh
                run: |
                    $merged = Get-ChildItem -Path coverage/report -Recurse -Filter Cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
                    if (-not $merged) {
                        throw "Merged Cobertura report was not produced."
                    }

                    [xml]$coverage = Get-Content -LiteralPath $merged.FullName
                    $rate = [double]$coverage.coverage.'line-rate'
                    $covered = [long]$coverage.coverage.'lines-covered'
                    $valid = [long]$coverage.coverage.'lines-valid'
                    if ($valid -le 0) {
                        throw "Merged coverage report has no valid lines."
                    }

                    $threshold = [double]$env:COVERAGE_MIN_LINE_RATE
                    "Merged line coverage: {0:P2} ({1}/{2}); threshold: {3:P2}" -f $rate, $covered, $valid, $threshold
                    if ($rate -lt $threshold) {
                        throw "Line coverage is below the configured threshold."
                    }

            -   name: Upload Coverage Artifact
                if: steps.covcheck.outputs.found == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
                uses: actions/upload-artifact@v7
                with:
                    name: coverage-report
                    retention-days: 30
                    path: coverage/report

            -   name: Write Coverage Summary
                if: always()
                shell: bash
                run: |
                    if [ -f coverage/report/Summary.txt ]; then
                      echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      cat coverage/report/Summary.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                    else
                      echo "Coverage gate executed; no text summary was produced." >> $GITHUB_STEP_SUMMARY
                    fi

    test-duration-summary:
        name: Test Duration Summary
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [ test-ubuntu, test-arm, test-windows, test-macos ]
        if: always()
        steps:
            -   name: Download TRX Artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: test-results-*
                    merge-multiple: true
                    path: test-results

            -   name: Write Top 5 Slowest Tests To Summary
                shell: python
                run: |
                    import glob, os, re
                    import xml.etree.ElementTree as ET

                    # TimeSpan "c" format: [d.]hh:mm:ss[.fffffff]
                    pattern = re.compile(r"^(?:(\d+)\.)?(\d+):(\d+):(\d+(?:\.\d+)?)$")
                    results, skipped = [], 0
                    files = glob.glob("test-results/**/*.trx", recursive=True)
                    for path in files:
                        rows = []
                        try:
                            for _, node in ET.iterparse(path):
                                if not node.tag.endswith("UnitTestResult"):
                                    continue
                                text = node.get("duration") or ""
                                match = pattern.match(text)
                                if match:
                                    days, hours, minutes, seconds = match.groups()
                                    total = int(days or 0) * 86400 + int(hours) * 3600 + int(minutes) * 60 + float(seconds)
                                    rows.append((total, node.get("testName") or "<unknown>", text))
                                node.clear()
                        except (ET.ParseError, OSError, UnicodeDecodeError):
                            # A malformed TRX (for example duplicate attributes) is skipped as a whole.
                            skipped += 1
                            continue
                        results += rows

                    lines = ["### Slowest tests (top 5)"]
                    if not files:
                        lines.append("_No TRX files were found._")
                    elif not results:
                        lines.append("_No per-test durations found in TRX files._")
                    for _, name, text in sorted(results, reverse=True)[:5]:
                        lines.append(f"- {name} - {text}")
                    if skipped:
                        lines += ["", f"_Skipped malformed TRX: {skipped}_"]
                    with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                        summary.write("\n".join(lines) + "\n")

    # Free SonarCloud for public OSS. Create project + SONAR_TOKEN before first green run:
    # https://sonarcloud.io → import GitHub org squirix → project key squirix
    # GitHub secret: SONAR_TOKEN (My Account → Security → Generate Tokens)
    # Optional repo variables: SONAR_ORGANIZATION, SONAR_PROJECT_KEY
    # Coverage: wait for ubuntu test jobs, download Cobertura reports, pass
    # sonar.cs.cobertura.reportsPaths before end (MTP CodeCoverage emits Cobertura; OpenCover unsupported).
    #
    # Quality gate: OSS plan cannot create custom gates (API actions.create=false; only built-in
    # "Sonar way" with Coverage on New Code ≥ 80%). CI Cobertura merge gate stays at 70% overall.
    # sonar.qualitygate.wait=false so Sonar analysis + PR decoration still run, but Sonar way
    # new-coverage does not fail the job. If the org upgrades to Team/Enterprise:
    #   Quality Gates → Create "squirix-ci" (or copy Sonar way) → set new_coverage ≥ 50%
    #   (pragmatic) or ≥ 70% (align with Cobertura) → keep new_duplicated_lines_density ≤ 3%
    #   → assign to project key squirix → then re-enable wait=true below.
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: read
            # Lists the jobs of this run to wait for the ubuntu tests.
            actions: read
        # No `needs` on test-ubuntu: the job builds while the tests run and waits for them in a step.
        needs: [ changes ]
        # PR fast path: SonarCloud runs on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' &&
            (needs.changes.outputs.code == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'squirix' }}
            SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'squirix' }}
        steps:
            -   name: Require SONAR_TOKEN
                shell: bash
                run: |
                    if [[ -z "${SONAR_TOKEN}" ]]; then
                      echo "Missing secrets.SONAR_TOKEN." >&2
                      echo "1) Create a free SonarCloud org/project for public repo squirix/squirix" >&2
                      echo "2) Generate a token (My Account → Security)" >&2
                      echo "3) Add GitHub Actions secret SONAR_TOKEN" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            # Reads the package cache of the build jobs; see verify-coding-conventions.
            -   name: Restore NuGet Package Cache
                uses: actions/cache/restore@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

            # Holds what the scanner downloads from SonarCloud. Java is not part of it: the scanner uses the one of the runner image.
            -   name: Cache SonarCloud Packages
                uses: actions/cache@v6
                with:
                    path: ~/.sonar/cache
                    key: ${{ runner.os }}-sonar-engine

            -   name: Cache SonarCloud Scanner
                id: cache-sonar-scanner
                uses: actions/cache@v6
                with:
                    path: .sonar/scanner
                    key: ${{ runner.os }}-sonar-scanner
                    restore-keys: |
                        ${{ runner.os }}-sonar-scanner

            -   name: Install SonarCloud Scanner
                if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
                shell: bash
                run: |
                    mkdir -p .sonar/scanner
                    dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

            -   name: Ensure SonarCloud Scanner Present
                shell: bash
                run: |
                    if [[ ! -x .sonar/scanner/dotnet-sonarscanner ]]; then
                      mkdir -p .sonar/scanner
                      dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner
                    fi

            # SquirixSonarAnalysis leaves only the Sonar analyzers in this build; see Directory.Build.props.
            -   name: Restore
                run: dotnet restore squirix.slnx -p:SquirixSonarAnalysis=true

            -   name: Begin Analysis And Build
                shell: bash
                env:
                    GITHUB_EVENT_NAME: ${{ github.event_name }}
                    SONAR_PR_KEY: ${{ github.event.pull_request.number }}
                    SONAR_PR_BRANCH: ${{ github.head_ref }}
                    SONAR_PR_BASE: ${{ github.base_ref }}
                    SONAR_PR_GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    set -euo pipefail

                    # The runner image ships the Java the scanner engine runs on, so the scanner need not download one.
                    java="${JAVA_HOME_21_X64:?The runner image has no Java 21.}/bin/java"

                    begin_args=(
                      begin
                      "/k:${SONAR_PROJECT_KEY}"
                      "/o:${SONAR_ORGANIZATION}"
                      "/d:sonar.token=${SONAR_TOKEN}"
                      "/d:sonar.host.url=https://sonarcloud.io"
                      "/d:sonar.qualitygate.wait=false"
                      "/d:sonar.scanner.skipJreProvisioning=true"
                      "/d:sonar.scanner.javaExePath=${java}"
                      "/d:sonar.exclusions=**/bin/**,**/obj/**,**/.sonar/**,**/tools/**,**/samples/**,**/build/**,**/benchmarks/**"
                      "/d:sonar.coverage.exclusions=**/src/squirix.server.host/**,**/src/squirix.protocol-model/Program.cs,**/tools/**,**/samples/**,**/build/**,**/benchmarks/**"
                      # Intentional cross-assembly twins (nsdepcop forbids references in both directions,
                      # so the metadata chain engine cannot be shared): excluded from duplication only.
                      "/d:sonar.cpd.exclusions=**/src/squirix/ClientSerializerMetadata.cs,**/src/squirix.server/Core/ServerSerializerMetadata.cs"
                      "/d:sonar.cs.cobertura.reportsPaths=${GITHUB_WORKSPACE}/coverage/**/coverage.cobertura.xml"
                    )

                    if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
                      begin_args+=(
                        "/d:sonar.pullrequest.key=${SONAR_PR_KEY}"
                        "/d:sonar.pullrequest.branch=${SONAR_PR_BRANCH}"
                        "/d:sonar.pullrequest.base=${SONAR_PR_BASE}"
                        "/d:sonar.pullrequest.provider=GitHub"
                        "/d:sonar.pullrequest.github.repository=${SONAR_PR_GITHUB_REPOSITORY}"
                      )
                    fi

                    .sonar/scanner/dotnet-sonarscanner "${begin_args[@]}"
                    dotnet build squirix.slnx --configuration Release --no-restore -p:SquirixSonarAnalysis=true

            # The build above does not need the tests, so it runs while they do. The analysis is published only after the
            # ubuntu test jobs of this run have all succeeded, because it imports their coverage.
            -   name: Wait For The Ubuntu Tests
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    set -euo pipefail
                    jobs_url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"
                    started=${SECONDS}
                    deadline=$((started + 1800))
                    settled=0
                    while true; do
                      # The matrix jobs are listed once build-ubuntu has finished.
                      mapfile -t rows < <(gh api --paginate "${jobs_url}" \
                        --jq '.jobs[] | select(.name | startswith("Test (ubuntu-latest /")) | [.status, (.conclusion // "none"), .name] | @tsv')
                      pending=0
                      for row in "${rows[@]}"; do
                        IFS=$'\t' read -r status conclusion name <<< "${row}"
                        if [[ "${status}" != "completed" ]]; then
                          pending=1
                        elif [[ "${conclusion}" != "success" ]]; then
                          echo "${name} finished with '${conclusion}'; there is no complete coverage to import." >&2
                          exit 1
                        fi
                      done
                      # Two listings in a row must agree, so a listing taken while the matrix is being created cannot end the wait.
                      if [[ ${#rows[@]} -gt 0 && ${pending} -eq 0 ]]; then
                        if [[ ${settled} -eq ${#rows[@]} ]]; then
                          echo "All ${#rows[@]} ubuntu test jobs succeeded."
                          break
                        fi
                        settled=${#rows[@]}
                      else
                        settled=0
                      fi
                      if (( SECONDS > deadline )); then
                        echo "The ubuntu test jobs did not finish in time." >&2
                        exit 1
                      fi
                      # This job ends the run, so it polls often: 1 s before the confirming listing, every 2 s in the first minute,
                      # then every 10 s (tests queued for a runner) to stay well inside the API rate limit of the token.
                      if (( settled > 0 )); then
                        sleep 1
                      elif (( SECONDS - started < 60 )); then
                        sleep 2
                      else
                        sleep 10
                      fi
                    done

            -   name: Download Coverage Reports
                uses: actions/download-artifact@v8
                with:
                    pattern: coverage-raw-net10.0-*
                    merge-multiple: true
                    path: coverage

            -   name: Verify Cobertura Reports For Sonar
                shell: bash
                run: |
                    mapfile -t files < <(find coverage -name coverage.cobertura.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                      echo "No coverage.cobertura.xml found for SonarCloud import." >&2
                      echo "Expected Cobertura from ubuntu test jobs (Microsoft.Testing.Extensions.CodeCoverage)." >&2
                      find coverage -type f -print 2>/dev/null || true
                      exit 1
                    fi
                    echo "Found ${#files[@]} Cobertura report(s) for SonarCloud."

            -   name: Publish Analysis To SonarCloud
                shell: bash
                run: .sonar/scanner/dotnet-sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"

    # PVS-Studio Team: full analysis of production packages; fail CI when warnings remain.
    # Secret: PVS_STUDIO_CREDENTIALS = "<license-name> <license-key>"
    # Skipped on fork PRs (secrets unavailable). No SARIF upload.
    # Uses the pre-baked analysis container (ghcr.io/squirix/braid-pvs-studio) that
    # already carries the .NET 10.0.401 SDK plus pvs-studio/pvs-studio-dotnet, so
    # CI no longer installs the analyzer via apt on every run. The analyzer
    # license is NOT baked in; it is activated at runtime via credentials.
    # TODO(.NET 11): temporarily disabled until PVS-Studio supports the .NET 11 SDK;
    # re-enable the condition below and the strict gate assertion when it does.
    pvs-studio:
        name: PVS-Studio
        runs-on: ubuntu-latest
        container:
            # Pin the immutable image digest instead of the mutable :latest tag so
            # CI always runs the reviewed build. Because the image is released via
            # :latest re-tagging (weekly rebuild in the braid repo), bump this digest
            # to adopt a newer analyzer build.
            image: ghcr.io/squirix/braid-pvs-studio@sha256:854d6ce7d6e157624df445418ddd6ed86b75d00f63df41e8c65ffe2d7e84b9f9
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
        permissions:
            contents: read
        needs: [ changes ]
        # TODO(.NET 11): disabled until PVS-Studio supports the .NET 11 SDK; restore the
        # change-detection condition when re-enabling.
        if: false
        steps:
            -   name: Require PVS_STUDIO_CREDENTIALS
                shell: bash
                env:
                    PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
                run: |
                    if [[ -z "${PVS_STUDIO_CREDENTIALS}" ]]; then
                      echo "Missing secrets.PVS_STUDIO_CREDENTIALS." >&2
                      echo "Add GitHub Actions secret PVS_STUDIO_CREDENTIALS as: <name> <license-key>" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            # Reads the package cache of the build jobs; see verify-coding-conventions.
            -   name: Restore NuGet Package Cache
                uses: actions/cache/restore@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

            -   name: Restore production projects
                run: |
                    for p in \
                      src/squirix/Squirix.csproj \
                      src/squirix.server/Squirix.Server.csproj \
                      src/squirix.server.host/Squirix.Server.Host.csproj \
                      src/squirix.protocol-model/Squirix.ProtocolModel.csproj; do
                      dotnet restore "$p"
                    done

            -   name: Configure PVS-Studio License
                shell: bash
                env:
                    PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
                run: |
                    set -euo pipefail
                    # Writes license under ~/.config/PVS-Studio after build; keep secret off restore/build/analyze.
                    # shellcheck disable=SC2086
                    pvs-studio-analyzer credentials ${PVS_STUDIO_CREDENTIALS}

            -   name: Analyze With PVS-Studio
                id: analyze
                shell: bash
                timeout-minutes: 20
                run: |
                    set -uo pipefail
                    mkdir -p pvs-studio-out
                    echo "report=false" >> "$GITHUB_OUTPUT"
                    exit_code=0
                    pvs-studio-dotnet \
                      -t src/squirix/Squirix.csproj \
                      -t src/squirix.server/Squirix.Server.csproj \
                      -t src/squirix.server.host/Squirix.Server.Host.csproj \
                      -t src/squirix.protocol-model/Squirix.ProtocolModel.csproj \
                      -o pvs-studio-out/pvs-studio-report.json \
                      -c Release \
                      -C .pvsconfig \
                      -r \
                      --disableLicenseExpirationCheck \
                      --selectProjects "Squirix;Squirix.Server;Squirix.Server.Host;Squirix.ProtocolModel" \
                      || exit_code=$?

                    echo "pvs-studio-dotnet exit_code=${exit_code}"

                    if [[ -f pvs-studio-out/pvs-studio-report.json ]]; then
                      echo "report=true" >> "$GITHUB_OUTPUT"
                    fi

                    # Shell launch failures (126/127) overlap license/analyzer bits if bit-tested first.
                    if [[ "$exit_code" -eq 126 || "$exit_code" -eq 127 ]]; then
                      echo "pvs-studio-dotnet failed to launch (exit_code=${exit_code})." >&2
                      exit 1
                    fi

                    if (( (exit_code & 1) != 0 )); then
                      echo "PVS-Studio license error (exit bit 1)." >&2
                      exit 1
                    fi
                    if (( (exit_code & 2) != 0 )); then
                      echo "PVS-Studio analyzer error (exit bit 2)." >&2
                      exit 1
                    fi
                    # Bit 8 = warnings present. Gate via plog-converter on the JSON report
                    # (post-suppress) with the same all-groups/all-level filter as artifacts.
                    if (( (exit_code & ~4 & ~8) != 0 )); then
                      echo "Unexpected pvs-studio-dotnet exit_code=${exit_code}" >&2
                      exit 1
                    fi

                    if [[ ! -f pvs-studio-out/pvs-studio-report.json ]]; then
                      echo "PVS-Studio report missing." >&2
                      exit 1
                    fi

                    # plog-converter defaults to GA:1,2 only unless -a is set.
                    pvs_all_groups='GA:1,2,3;64:1,2,3;OP:1,2,3;CS:1,2,3;MISRA:1,2,3;AUTOSAR:1,2,3;OWASP:1,2,3'

                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t totals \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-totals.txt \
                      || true
                    if [[ -f pvs-studio-out/pvs-studio-totals.txt ]]; then
                      {
                        echo "## PVS-Studio totals (all groups/levels)"
                        echo '```'
                        cat pvs-studio-out/pvs-studio-totals.txt
                        echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                      cat pvs-studio-out/pvs-studio-totals.txt
                    fi

                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t errorfile \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-all.txt \
                      || true
                    if [[ -f pvs-studio-out/pvs-studio-all.txt ]]; then
                      {
                        echo "## PVS-Studio findings (all)"
                        echo '```'
                        cat pvs-studio-out/pvs-studio-all.txt
                        echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                      echo "--- all findings ---"
                      cat pvs-studio-out/pvs-studio-all.txt
                    fi

                    # Fail CI when any warning remains after suppress filtering (all groups/levels).
                    gate_code=0
                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t totals \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-gate-totals.txt \
                      --indicate-warnings \
                      || gate_code=$?
                    if [[ -f pvs-studio-out/pvs-studio-gate-totals.txt ]]; then
                      echo "--- gate filter (all groups/levels) ---"
                      cat pvs-studio-out/pvs-studio-gate-totals.txt
                    fi
                    if [[ "$gate_code" -eq 2 ]]; then
                      echo "PVS-Studio gate failed: warnings remain (all groups/levels)." >&2
                      exit 1
                    fi
                    if [[ "$gate_code" -ne 0 ]]; then
                      echo "plog-converter gate failed with exit_code=${gate_code}" >&2
                      exit 1
                    fi

            -   name: Convert Report To HTML
                if: always() && steps.analyze.outputs.report == 'true'
                shell: bash
                run: |
                    set -euo pipefail
                    # fullhtml: -o is the output directory. With -n, plog-converter creates
                    # "<o>/<n>.fullhtml" and requires the -o parent to already exist.
                    mkdir -p pvs-studio-out
                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t fullhtml \
                      -a 'GA:1,2,3;64:1,2,3;OP:1,2,3;CS:1,2,3;MISRA:1,2,3;AUTOSAR:1,2,3;OWASP:1,2,3' \
                      -o pvs-studio-out \
                      -n html

            -   name: Upload PVS-Studio Report
                if: always() && steps.analyze.outputs.report == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: pvs-studio-report
                    retention-days: 14
                    if-no-files-found: warn
                    path: |
                        pvs-studio-out/pvs-studio-report.json
                        pvs-studio-out/pvs-studio-totals.txt
                        pvs-studio-out/pvs-studio-all.txt
                        pvs-studio-out/pvs-studio-gate-totals.txt
                        pvs-studio-out/html.fullhtml/**

    # NDepend (Team): full analysis via the official NDepend GitHub Action with squirix.ndproj.
    # Fails CI when any configured quality gate fails (stopIfQGFailed=true).
    # Baseline = base branch (PRs) or most recent analysis on the same branch (push/schedule/dispatch),
    # mirroring the "PR base / previous commit" regression rule.
    # Secret: NDependLicense = NDepend GitHub Action activation data
    # (https://www.ndepend.com/activation_githubaction). Skipped on fork PRs (secrets unavailable).
    # The action uploads an `ndepend` artifact and posts a summary comment on same-repo PRs.
    ndepend:
        name: NDepend
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            actions: read
            pull-requests: write
        needs: [ changes ]
        # PR fast path: NDepend runs on push/schedule/dispatch only.
        if: |
            github.event_name != 'pull_request' &&
            (needs.changes.outputs.code == 'true' ||
             needs.changes.outputs.ndepend == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        steps:
            -   name: Require NDependLicense
                shell: bash
                env:
                    NDEPEND_LICENSE: ${{ secrets.NDependLicense }}
                run: |
                    if [[ -z "${NDEPEND_LICENSE}" ]]; then
                      echo "Missing secrets.NDependLicense." >&2
                      echo "Add the NDepend GitHub Action activation data as secret NDependLicense." >&2
                      echo "See https://www.ndepend.com/activation_githubaction" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            # Reads the package cache of the build jobs; see verify-coding-conventions.
            -   name: Restore NuGet Package Cache
                uses: actions/cache/restore@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-${{ runner.arch }}-nuget-build-${{ hashFiles('global.json', 'Directory.Packages.props') }}

            # NDepend reads the compiled assemblies; the analysis shards run the Roslyn analyzers. The build restores in the same process.
            -   name: Restore And Build
                run: dotnet build squirix.slnx --configuration Release -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false

            -   name: Synchronize NDepend project
                run: |
                    python3 build/ndepend/sync_ndproj.py
                    if ! git diff --exit-code --quiet -- squirix.ndproj; then
                        echo "squirix.ndproj is out of date with build/ndepend/squirix.ndrules." >&2
                        echo "Run python3 build/ndepend/sync_ndproj.py and commit the regenerated squirix.ndproj." >&2
                        exit 1
                    fi

            -   name: Run NDepend Analysis
                uses: ndepend/ndepend-action@6ea2f4658a571ae7d4e04a2ae07fa70464b68f14 # latest ndepend (unreleased; last release v1.0.0)
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    license: ${{ secrets.NDependLicense }}
                    customconfig: squirix.ndproj
                    baseline: ${{ github.event_name == 'pull_request' && format('{0}_recent', github.base_ref) || 'recent' }}
                    stopIfQGFailed: true
                    retention-days: 14

    ci-success:
        name: CI success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - changes
            - markdownlint
            - verify-coding-conventions
            - verify-line-endings
            - docker-build
            - build-ubuntu
            - package-smoke
            - analyze-ubuntu
            - build-arm
            - build-windows
            - build-macos
            - test-ubuntu
            - test-arm
            - test-windows
            - test-macos
            - post-build-checks
            - wire-alloc-guard
            - coverage
            - sonarcloud
            - pvs-studio
            - ndepend
        # This is the only required status check, and GitHub counts a skipped required check as passed. The job therefore runs
        # on every event and every change set: it must never be skipped, or a failed Detect Changes job (all outputs empty) and
        # a change set outside every filter would both make a pull request mergeable with nothing verified.
        if: always()
        steps:
            -   name: Verify Required Checks For This Change Set
                shell: bash
                env:
                    RESULT_CHANGES: ${{ needs.changes.result }}
                    DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
                    CODE_CHANGED: ${{ needs.changes.outputs.code }}
                    EVENT_NAME: ${{ github.event_name }}
                    GITHUB_REF: ${{ github.ref }}
                    GITHUB_BASE_REF: ${{ github.base_ref }}
                    PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                    REPO: ${{ github.repository }}
                    RESULT_MARKDOWNLINT: ${{ needs.markdownlint.result }}
                    RESULT_VERIFY: ${{ needs.verify-coding-conventions.result }}
                    RESULT_LINE_ENDINGS: ${{ needs.verify-line-endings.result }}
                    RESULT_DOCKER: ${{ needs.docker-build.result }}
                    RESULT_BUILD_UBUNTU: ${{ needs.build-ubuntu.result }}
                    RESULT_PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
                    RESULT_ANALYZE_UBUNTU: ${{ needs.analyze-ubuntu.result }}
                    RESULT_BUILD_ARM: ${{ needs.build-arm.result }}
                    RESULT_BUILD_WINDOWS: ${{ needs.build-windows.result }}
                    RESULT_BUILD_MACOS: ${{ needs.build-macos.result }}
                    RESULT_TEST_UBUNTU: ${{ needs.test-ubuntu.result }}
                    RESULT_TEST_ARM: ${{ needs.test-arm.result }}
                    RESULT_TEST_WINDOWS: ${{ needs.test-windows.result }}
                    RESULT_TEST_MACOS: ${{ needs.test-macos.result }}
                    RESULT_POST_BUILD_CHECKS: ${{ needs.post-build-checks.result }}
                    RESULT_WIRE_ALLOC: ${{ needs.wire-alloc-guard.result }}
                    RESULT_COVERAGE: ${{ needs.coverage.result }}
                    RESULT_SONAR: ${{ needs.sonarcloud.result }}
                    RESULT_PVS: ${{ needs.pvs-studio.result }}
                    RESULT_NDEPEND: ${{ needs.ndepend.result }}
                    NDEPEND_CHANGED: ${{ needs.changes.outputs.ndepend }}
                run: |
                    set -euo pipefail
                    failed=0

                    require_docs=false
                    require_code=false
                    require_docker=false
                    require_line_endings=false
                    require_sonar=false
                    require_pvs=false
                    require_ndepend=false
                    require_wire_alloc=false
                    if [[ "$DOCS_CHANGED" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_docs=true
                    fi
                    if [[ "$CODE_CHANGED" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_code=true
                    fi
                    if [[ "${{ needs.changes.outputs.docker }}" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_docker=true
                    fi
                    if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      require_line_endings=true
                    fi
                    if [[ "$require_code" == "true" && ( "$GITHUB_REF" == "refs/heads/develop" || "$GITHUB_BASE_REF" == "develop" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ) ]]; then
                      require_wire_alloc=true
                    fi
                    if [[ "$require_code" == "true" && ( "$EVENT_NAME" != "pull_request" || "$PR_HEAD_REPO" == "$REPO" ) ]]; then
                      require_sonar=true
                      require_pvs=true
                    fi
                    if [[ ( "$require_code" == "true" || "$NDEPEND_CHANGED" == "true" ) && ( "$EVENT_NAME" != "pull_request" || "$PR_HEAD_REPO" == "$REPO" ) ]]; then
                      require_ndepend=true
                    fi

                    assert_success() {
                      local name="$1"
                      local required="$2"
                      local result="$3"
                      if [[ "$required" != "true" ]]; then
                        echo "SKIP $name (not required for this change set)"
                        return 0
                      fi
                      if [[ "$result" == "success" ]]; then
                        echo "OK   $name"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    assert_success_or_skipped() {
                      local name="$1"
                      local required="$2"
                      local result="$3"
                      if [[ "$required" != "true" ]]; then
                        echo "SKIP $name (not required for this change set)"
                        return 0
                      fi
                      if [[ "$result" == "success" || "$result" == "skipped" ]]; then
                        echo "OK   $name result=$result"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    # Every requirement above is derived from the change detection outputs, so a detection that did not
                    # succeed leaves nothing to trust: fail instead of treating every check as not required.
                    assert_success "changes" "true" "$RESULT_CHANGES"

                    assert_success "markdownlint" "$require_docs" "$RESULT_MARKDOWNLINT"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "verify-coding-conventions" "$require_code" "$RESULT_VERIFY"
                    assert_success "verify-line-endings" "$require_line_endings" "$RESULT_LINE_ENDINGS"
                    assert_success "docker-build" "$require_docker" "$RESULT_DOCKER"

                    assert_success "build-ubuntu" "$require_code" "$RESULT_BUILD_UBUNTU"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "package-smoke" "$require_code" "$RESULT_PACKAGE_SMOKE"
                    # The test artifacts are built without analyzers, so the analyzed build is required on every event.
                    assert_success "analyze-ubuntu" "$require_code" "$RESULT_ANALYZE_UBUNTU"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "build-arm" "$require_code" "$RESULT_BUILD_ARM"
                    assert_success_or_skipped "build-windows" "$require_code" "$RESULT_BUILD_WINDOWS"
                    assert_success_or_skipped "build-macos" "$require_code" "$RESULT_BUILD_MACOS"
                    assert_success "test-ubuntu" "$require_code" "$RESULT_TEST_UBUNTU"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "test-arm" "$require_code" "$RESULT_TEST_ARM"
                    assert_success_or_skipped "test-windows" "$require_code" "$RESULT_TEST_WINDOWS"
                    assert_success_or_skipped "test-macos" "$require_code" "$RESULT_TEST_MACOS"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "post-build-checks" "$require_code" "$RESULT_POST_BUILD_CHECKS"
                    assert_success "wire-alloc-guard" "$require_wire_alloc" "$RESULT_WIRE_ALLOC"
                    # PR fast path: skipped on pull_request, required otherwise.
                    assert_success_or_skipped "coverage" "$require_code" "$RESULT_COVERAGE"
                    assert_success_or_skipped "sonarcloud" "$require_sonar" "$RESULT_SONAR"
                    # TODO(.NET 11): back to assert_success when the pvs-studio job is re-enabled.
                    assert_success_or_skipped "pvs-studio" "$require_pvs" "$RESULT_PVS"
                    assert_success_or_skipped "ndepend" "$require_ndepend" "$RESULT_NDEPEND"

                    if [[ "$failed" -ne 0 ]]; then
                      exit 1
                    fi

    stability-stress:
        name: Stability Stress (Weekly / Manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Restore And Build
                run: dotnet build squirix.slnx --configuration Release

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Run Selected Resiliency Stress Checks
                run: dotnet run --file ./tools/internal/sqr-resiliency-repeat.cs -- -Iterations 5 -Configuration Release -NoBuild

            -   name: Run E2E Stress Suite
                shell: bash
                env:
                    SQUIRIX_STRESS_SCALE: "0.5"
                run: |
                    set -o pipefail
                    dotnet test --project tests/squirix.e2e.tests/Squirix.E2ETests.csproj \
                      --configuration Release \
                      --no-build \
                      --treenode-filter "/*/*/*/*[Suite=Stress]" \
                      --timeout 30m 2>&1 | tee test-output-e2e-stress.log
                    if grep -q "Zero tests ran" test-output-e2e-stress.log; then
                      echo "E2E stress filter matched zero tests. Failing the build." >&2
                      exit 1
                    fi
