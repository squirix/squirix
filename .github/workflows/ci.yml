name: CI

on:
    # develop and main push/PR: temporary full ubuntu/windows/macos matrix on develop.
    # Builds/tests are split per OS so ubuntu smoke/tests/Sonar are not gated on Windows/macOS build.
    # Fast e2e wire-alloc benchmarks remain develop-only.
    # Weekly schedule and manual dispatch also run the full cross-OS matrix.
    # Restore develop ubuntu-only fast-path later if the daily full matrix is no longer needed.
    # Weekly schedule also runs stability-stress (resiliency repeat + E2E Suite=Stress).
    # SonarCloud (OSS): same-repo code changes; requires secrets.SONAR_TOKEN + SonarCloud project.
    # PVS-Studio (Team): same-repo code changes; requires secrets.PVS_STUDIO_CREDENTIALS ("name key").
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    # Weekly full cross-OS run (same test matrix as manual dispatch).
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
            docs: ${{ steps.filter.outputs.docs }}
            docker: ${{ steps.filter.outputs.docker }}
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Paths Filter
                # Pin includes some-with-excludes so negated !**/*.ndproj|ndrules actually exclude.
                uses: dorny/paths-filter@4711b7a31b4aa89103d8c6ffab2e3b8e7b6381c7 # master (some-with-excludes)
                id: filter
                with:
                    predicate-quantifier: 'some-with-excludes'
                    filters: |
                        code:
                          - 'src/**'
                          - 'tests/**'
                          - 'tools/**'
                          - 'build/**'
                          - 'examples/**'
                          - 'benchmarks/**'
                          - 'samples/**'
                          - '.github/workflows/**'
                          - '.github/actions/**'
                          - 'Directory.Build.props'
                          - 'Directory.Packages.props'
                          - 'global.json'
                          - 'stylecop.json'
                          - 'BannedSymbols.txt'
                          - 'BannedSymbols.Reflection.txt'
                          - 'BannedSymbols.Storage.txt'
                          - '.globalconfig'
                          - '.editorconfig'
                          - '.pvsconfig'
                          - 'squirix.slnx'
                          - 'squirix.slnx.DotSettings'
                          - 'coverlet.runsettings'
                          - 'clean-bin-obj.bat'
                          - 'clean-bin-obj.sh'
                          # NDepend project/rules edits must not trigger the code CI matrix.
                          - '!**/*.ndproj'
                          - '!**/*.ndrules'
                          # PVS-Studio suppress baselines must not trigger the code CI matrix.
                          - '!**/*.suppress'
                          - '!**/*.suppress.json'
                        docs:
                          - '**/*.md'
                          - 'docs/**'
                          - 'contributing.md'
                          - '.markdownlint.json'
                          - '.markdownlint-cli2.jsonc'
                        docker:
                          - 'docker/Dockerfile'
                          - 'docker/Dockerfile.release'
                          - 'docker/**'
                          - '.dockerignore'
                          - 'src/squirix/**'
                          - 'src/shared/**'
                          - 'src/squirix.server/**'
                          - 'src/squirix.server.host/**'
                          - 'Directory.Build.props'
                          - 'Directory.Packages.props'
                          - 'global.json'
                          - 'stylecop.json'
                          - 'BannedSymbols.txt'
                          - 'BannedSymbols.Reflection.txt'
                          - 'BannedSymbols.Storage.txt'
                          - '.globalconfig'
                          - '.editorconfig'
                          - 'squirix.slnx'

    markdownlint:
        name: Documentation Lint (Markdownlint)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: changes
        if: |
            needs.changes.outputs.docs == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Markdownlint
                uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
                with:
                    config: .markdownlint-cli2.jsonc

    # dotnet format is slow; run it once on the cheapest runner instead of every matrix cell.
    # Pull requests: changed solution .cs files only (full solution on global config / project changes).
    # Push, schedule, and workflow_dispatch: full solution.
    verify-coding-conventions:
        name: Verify Coding Conventions (.editorconfig)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: changes
        if: |
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Restore
                run: dotnet restore squirix.slnx

            -   name: Verify .NET 10 Baseline
                run: dotnet run --file ./tools/internal/sqr-net10-verify.cs --

            -   name: Verify File-Based Durability Tools (sqr-*.cs)
                run: dotnet run --file ./tools/internal/sqr-tools-verify.cs --

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Verify File-Based Examples
                run: dotnet run --file ./tools/internal/sqr-examples-verify.cs --

            -   name: Verify Coding Conventions (.editorconfig)
                shell: bash
                run: bash tools/ci/verify-dotnet-format.sh

    # Pull requests: fail when changed text files are committed with CRLF (LF required by .editorconfig).
    verify-line-endings:
        name: Verify Line Endings (LF)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event_name == 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0

            -   name: Verify Line Endings In Changed Files
                shell: bash
                run: bash tools/ci/verify-line-endings.sh

    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: changes
        if: |
            needs.changes.outputs.docker == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set Up Docker Buildx
                uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            -   name: Build Image
                uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
                with:
                    context: .
                    file: docker/Dockerfile
                    push: false
                    tags: squirix-server:ci
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

    # Per-OS builds so ubuntu consumers are not blocked on Windows/macOS restore+build.
    # Keep display names identical to the former matrix jobs for branch-protection continuity.
    build-ubuntu:
        name: Build (ubuntu-latest / net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        needs: changes
        if: |
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Build Release Outputs
                uses: ./.github/actions/build-release
                with:
                    artifact-os: ubuntu-latest
                    framework: net10.0
                    run-package-smoke: ${{ github.event_name != 'pull_request' }}

    build-windows:
        name: Build (windows-latest / net10.0)
        runs-on: windows-latest
        timeout-minutes: 45
        needs: changes
        if: |
            ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop')) && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Build Release Outputs
                uses: ./.github/actions/build-release
                with:
                    artifact-os: windows-latest
                    framework: net10.0
                    run-package-smoke: "false"

    build-macos:
        name: Build (macos-latest / net10.0)
        runs-on: macos-latest
        timeout-minutes: 45
        needs: changes
        if: |
            ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop')) && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Build Release Outputs
                uses: ./.github/actions/build-release
                with:
                    artifact-os: macos-latest
                    framework: net10.0
                    run-package-smoke: "false"

    smoke-fast-fail:
        name: Smoke Fast-Fail (Ubuntu / Net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: build-ubuntu
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Download Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-output-ubuntu-latest-net10.0
                    path: .

            -   name: Restore (Resolve Packages For Collectors)
                run: dotnet restore squirix.slnx

            -   name: Restore Executable Bits For Test Hosts (Unix)
                if: runner.os != 'Windows'
                shell: bash
                run: |
                    chmod +x tests/squirix.server/squirix.server.smoke-tests/bin/Release/net10.0/Squirix.Server.SmokeTests || true

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Run Auth-Protected Surface Smoke Tests (Fast-Fail)
                shell: bash
                run: |
                    set -o pipefail
                    dotnet test tests/squirix.server/squirix.server.smoke-tests/Squirix.Server.SmokeTests.csproj -f net10.0 --configuration Release --no-build --verbosity normal \
                      --blame-hang-timeout 5m \
                      --filter "FullyQualifiedName~AuthSmokeTests" 2>&1 | tee test-output-smoke-auth.log

            -   name: Run Smoke Tests
                shell: bash
                run: |
                    set -o pipefail
                    mkdir -p coverage/smoke
                    dotnet test tests/squirix.server/squirix.server.smoke-tests/Squirix.Server.SmokeTests.csproj -f net10.0 --configuration Release --no-build --verbosity normal \
                      --blame-hang-timeout 5m \
                      --logger "trx;LogFileName=smoke.trx" \
                      --results-directory "${{ github.workspace }}/coverage/smoke" \
                      --settings coverlet.runsettings --collect:"XPlat Code Coverage" 2>&1 | tee test-output-smoke.log

            -   name: Verify Smoke Coverage Was Collected
                shell: bash
                run: |
                    mapfile -t files < <(find coverage/smoke -name coverage.cobertura.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                      echo "Smoke tests passed, but no coverage.cobertura.xml was produced." >&2
                      echo "Coverage directory contents:" >&2
                      find coverage/smoke -type f -print 2>/dev/null || true
                      ls -R coverage || true
                      exit 1
                    fi

            -   name: Upload Smoke Coverage Files
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: coverage-raw-net10.0-smoke
                    retention-days: 1
                    path: |
                        coverage/**/coverage.cobertura.xml
                        coverage/**/coverage.opencover.xml
                    if-no-files-found: error

            -   name: Upload Smoke Test Results (TRX)
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: test-results-ubuntu-latest-net10.0-smoke
                    retention-days: 1
                    path: '**/*.trx'
                    if-no-files-found: warn

            -   name: Fail On gRPC Cancellation Errors In Logs
                if: always()
                shell: bash
                run: |
                    if grep -Ei 'gRPC method .+ (task )?canceled' test-output-smoke-auth.log test-output-smoke.log; then
                      echo "Found gRPC cancellation errors in logs. Failing the build." >&2
                      exit 1
                    else
                      echo "No gRPC cancellation errors detected."
                    fi

    # Fast BenchmarkDotNet gate for develop (PR + push). Job.ShortRun unless SQUIRIX_E2E_BENCHMARK_LONG=1;
    # CI overrides warmup/iterations and runs a smoke subset (GetValue + Set × scalar/structured × durability).
    # Full 52-row wire-alloc matrix stays local — docs/benchmarks/e2e-benchmarks.md / wire-alloc-baseline.md.
    benchmarks-fast:
        name: Benchmarks Fast (Ubuntu / Wire Alloc)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        needs: [ changes, build-ubuntu ]
        if: |
            needs.changes.outputs.code == 'true' && (
              github.ref == 'refs/heads/develop' ||
              github.base_ref == 'develop' ||
              github.event_name == 'schedule' ||
              github.event_name == 'workflow_dispatch'
            )
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
            BDN_ARTIFACTS: ${{ github.workspace }}/BenchmarkDotNet.Artifacts
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Download Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-output-ubuntu-latest-net10.0
                    path: .

            -   name: Restore (Resolve Packages For Benchmark Host)
                run: dotnet restore benchmarks/squirix.e2e.benchmarks/Squirix.E2EBenchmarks.csproj

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Run E2E Wire Allocation Smoke (GetValue + Set)
                shell: bash
                run: |
                    set -o pipefail
                    mkdir -p "$BDN_ARTIFACTS"
                    chmod +x benchmarks/squirix.e2e.benchmarks/bin/Release/net10.0/Squirix.E2EBenchmarks || true
                    # 8 cases (2 methods × 2 shapes × 2 durability) vs full 52-row matrix.
                    # Skip Remove*/IterationSetup and extra APIs; tighten ShortRun warmups for CI.
                    # Prefer iterationCount >= 3 — MinIterationTime(150) often yields empty rows at 1.
                    dotnet run --project benchmarks/squirix.e2e.benchmarks/Squirix.E2EBenchmarks.csproj \
                      --configuration Release \
                      --no-build \
                      -- \
                      --filter '*Wire*AllocBenchmarks.GetValueAsync|*Wire*AllocBenchmarks.SetAsync*' \
                      --warmupCount 1 \
                      --iterationCount 3 \
                      --exporters json \
                      --artifacts "$BDN_ARTIFACTS" 2>&1 | tee benchmark-wire-alloc.log

            -   name: Upload Benchmark Artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: benchmarks-fast-wire-alloc
                    retention-days: 7
                    path: |
                        BenchmarkDotNet.Artifacts/**
                        benchmark-wire-alloc.log
                    if-no-files-found: warn

    # Per-OS test matrices: ubuntu waits for smoke; Windows/macOS start as soon as their build finishes.
    test-ubuntu:
        name: Test (ubuntu-latest / net10.0 / ${{ matrix.suite }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [ build-ubuntu, smoke-fast-fail ]
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 7
            matrix:
                suite: [ unit, client-integration, server-unit, server-integration, e2e-single-node, e2e-multi-node, protocol-model ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: ubuntu-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "true"

    test-windows:
        name: Test (windows-latest / net10.0 / ${{ matrix.suite }})
        runs-on: windows-latest
        timeout-minutes: 20
        needs: [ build-windows ]
        if: |
            ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop')) && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 6
            matrix:
                suite: [ unit, client-integration, server-unit, server-integration, e2e-single-node, e2e-multi-node ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: windows-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "false"

    test-macos:
        name: Test (macos-latest / net10.0 / ${{ matrix.suite }})
        runs-on: macos-latest
        timeout-minutes: 20
        needs: [ build-macos ]
        if: |
            ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop')) && (
            needs.changes.outputs.code == 'true' ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
            )
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            max-parallel: 6
            matrix:
                suite: [ unit, client-integration, server-unit, server-integration, e2e-single-node, e2e-multi-node ]
        env:
            ASPNETCORE_ENVIRONMENT: Production
            DOTNET_ENVIRONMENT: Production
            DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run Test Suite
                uses: ./.github/actions/run-test-suite
                with:
                    os: macos-latest
                    framework: net10.0
                    suite: ${{ matrix.suite }}
                    collect-coverage: "false"

    # Full-profile explorer (~15s): safe run + three required broken-rule counterexamples.
    protocol-model-explorer:
        name: Protocol Model Explorer (Ubuntu / Full)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [ build-ubuntu, smoke-fast-fail ]
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Download Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-output-ubuntu-latest-net10.0
                    path: .

            -   name: Restore Executable Bits For Protocol Model (Unix)
                shell: bash
                run: chmod +x src/squirix.protocol-model/bin/Release/net10.0/Squirix.ProtocolModel || true

            -   name: Run Full-Profile Explorer
                shell: bash
                run: |
                    set -euo pipefail
                    EXE="src/squirix.protocol-model/bin/Release/net10.0/Squirix.ProtocolModel.dll"
                    OUT_ROOT="artifacts/protocol-model-explorer"
                    mkdir -p "$OUT_ROOT"

                    run_case() {
                      local broken="$1"
                      local expect_invariant="$2"
                      local out="$OUT_ROOT/$broken"
                      mkdir -p "$out"
                      echo "::group::explorer broken=$broken"
                      set +e
                      dotnet "$EXE" --profile full --output "$out" --broken "$broken"
                      local code=$?
                      set -e
                      echo "::endgroup::"
                      if [[ -z "$expect_invariant" ]]; then
                        # 0 = fixed point; 4 = MaxStates truncation without violation (documented residual risk).
                        if [[ "$code" -ne 0 && "$code" -ne 4 ]]; then
                          echo "Explorer exited $code for --broken $broken (expected 0 or 4)." >&2
                          cat "$out/summary.json" 2>/dev/null || true
                          exit 1
                        fi
                      elif [[ "$code" -ne 0 ]]; then
                        echo "Explorer exited $code for --broken $broken (expected 0)." >&2
                        cat "$out/summary.json" 2>/dev/null || true
                        exit 1
                      fi
                      if [[ ! -f "$out/summary.json" ]]; then
                        echo "Missing summary.json for --broken $broken." >&2
                        exit 1
                      fi
                      cat "$out/summary.json"
                      if [[ -z "$expect_invariant" ]]; then
                        if grep -Eq '"violation"[[:space:]]*:[[:space:]]*null' "$out/summary.json"; then
                          echo "OK safe full profile: no violation (exit=$code)"
                          return 0
                        fi
                        echo "Safe full profile expected violation:null." >&2
                        exit 1
                      fi
                      if grep -Fq "\"invariant\":\"$expect_invariant\"" "$out/summary.json"; then
                        echo "OK broken=$broken invariant=$expect_invariant"
                        return 0
                      fi
                      echo "Broken mode $broken expected invariant $expect_invariant." >&2
                      exit 1
                    }

                    run_case none ""
                    run_case vote ElectionSafety
                    run_case current-term-commit CurrentTermCommit
                    run_case read-index ReadIndex

            -   name: Upload Explorer Summaries
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: protocol-model-explorer-summaries
                    retention-days: 7
                    path: artifacts/protocol-model-explorer/**
                    if-no-files-found: warn

    verify-test-discovery:
        name: Verify Test Discovery (Ubuntu / Net10.0)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [ build-ubuntu, smoke-fast-fail ]
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Download Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-output-ubuntu-latest-net10.0
                    path: .

            -   name: Restore (Resolve Packages For Test Host)
                run: dotnet restore squirix.slnx

            -   name: Restore Executable Bits For Test Hosts (Unix)
                if: runner.os != 'Windows'
                shell: bash
                run: |
                    chmod +x tests/squirix/squirix.*-tests/bin/Release/net10.0/Squirix.*Tests || true
                    chmod +x tests/squirix.server/squirix.server.*-tests/bin/Release/net10.0/Squirix.*Tests || true
                    chmod +x tests/squirix.e2e.tests/bin/Release/net10.0/Squirix.E2ETests || true
                    chmod +x tests/squirix.protocol-model/squirix.protocol-model.tests/bin/Release/net10.0/Squirix.ProtocolModel.Tests || true

            -   name: Verify Test Discovery Per Project (Fail On Zero Tests)
                shell: bash
                run: |
                    set -euo pipefail

                    test_projects=()
                    while IFS= read -r -d '' f; do
                      test_projects+=("$f")
                    done < <(git ls-files -z '*Tests.csproj' '*E2ETests.csproj')

                    if [ ${#test_projects[@]} -eq 0 ]; then
                      echo "No test projects found (*.Tests.csproj)." >&2
                      exit 1
                    fi

                    for proj in "${test_projects[@]}"; do
                      echo "Verifying tests discovered in: $proj"
                      set +e
                      output="$(dotnet test "$proj" --configuration Release --no-build --list-tests -v q 2>&1)"
                      code=$?
                      set -e

                      if [ $code -ne 0 ]; then
                        echo "$output"
                        echo "dotnet test --list-tests failed for $proj (exit=$code)" >&2
                        exit $code
                      fi

                      if echo "$output" | grep -q 'No test is available'; then
                        echo "$output"
                        echo "No tests discovered in $proj" >&2
                        exit 1
                      fi

                      count="$(
                        set +e
                        echo "$output" \
                          | sed -n '/The following Tests are available:/,$p' \
                          | tail -n +2 \
                          | grep -E '^[[:space:]]*[^[:space:]]' \
                          | grep -cvE '^[[:space:]]*$'
                        true
                      )"
                      count="$(echo "${count:-0}" | tr -d '[:space:]')"
                      if [ "${count:-0}" -le 0 ]; then
                        echo "$output"
                        echo "No test names were listed for $proj" >&2
                        exit 1
                      fi

                      echo "Discovered $count tests in $proj"
                    done

    coverage:
        name: Coverage Report
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [ changes, markdownlint, verify-coding-conventions, smoke-fast-fail, test-ubuntu, verify-test-discovery ]
        if: |
            always() &&
            needs.markdownlint.result != 'failure' &&
            (needs.changes.outputs.code == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')
        env:
            COVERAGE_MIN_LINE_RATE: "0.70"
        steps:
            -   name: Download Raw Coverage Files
                uses: actions/download-artifact@v8
                with:
                    pattern: coverage-raw-net10.0-*
                    merge-multiple: true
                    path: coverage

            -   name: Check Coverage Files Exist
                id: covcheck
                shell: bash
                run: |
                    mapfile -t files < <(find coverage -name coverage.cobertura.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                        echo "No coverage files found." >&2
                        find coverage -type f -print 2>/dev/null || true
                        exit 1
                    fi

                    echo "found=true" >> "$GITHUB_OUTPUT"

            -   name: Merge Coverage Reports
                if: steps.covcheck.outputs.found == 'true'
                uses: danielpalme/ReportGenerator-GitHub-Action@a003c8fb9ac008fd0fffd5faa4f7d3ecb52e0675
                with:
                    reports: coverage/**/coverage.cobertura.xml
                    targetdir: coverage/merged
                    reporttypes: Cobertura
                    assemblyfilters: '+Squirix;+Squirix.Server;-Squirix.TestKit;-Squirix.Server.TestKit'
                    classfilters: '+*;-JetBrains.Annotations.*'

            -   name: Enforce Coverage Gate
                if: steps.covcheck.outputs.found == 'true'
                shell: pwsh
                run: |
                    $merged = Get-ChildItem -Path coverage/merged -Recurse -Filter Cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
                    if (-not $merged) {
                        throw "Merged Cobertura report was not produced."
                    }

                    [xml]$coverage = Get-Content -LiteralPath $merged.FullName
                    $rate = [double]$coverage.coverage.'line-rate'
                    $covered = [long]$coverage.coverage.'lines-covered'
                    $valid = [long]$coverage.coverage.'lines-valid'
                    if ($valid -le 0) {
                        throw "Merged coverage report has no valid lines."
                    }

                    $threshold = [double]$env:COVERAGE_MIN_LINE_RATE
                    "Merged line coverage: {0:P2} ({1}/{2}); threshold: {3:P2}" -f $rate, $covered, $valid, $threshold
                    if ($rate -lt $threshold) {
                        throw "Line coverage is below the configured threshold."
                    }

            -   name: Generate Coverage Report
                if: steps.covcheck.outputs.found == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
                uses: danielpalme/ReportGenerator-GitHub-Action@a003c8fb9ac008fd0fffd5faa4f7d3ecb52e0675
                with:
                    reports: coverage/**/coverage.cobertura.xml
                    targetdir: coverage/report
                    reporttypes: HtmlInline;Cobertura;TextSummary
                    assemblyfilters: '+Squirix;+Squirix.Server;-Squirix.TestKit;-Squirix.Server.TestKit'
                    classfilters: '+*;-JetBrains.Annotations.*'

            -   name: Upload Coverage Artifact
                if: steps.covcheck.outputs.found == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
                uses: actions/upload-artifact@v7
                with:
                    name: coverage-report
                    retention-days: 30
                    path: coverage/report

            -   name: Write Coverage Summary
                if: always()
                shell: bash
                run: |
                    if [ -f coverage/report/Summary.txt ]; then
                      echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                      cat coverage/report/Summary.txt >> $GITHUB_STEP_SUMMARY
                      echo '```' >> $GITHUB_STEP_SUMMARY
                    else
                      echo "Coverage gate executed. HTML report generation is enabled only for main/develop/schedule/manual runs." >> $GITHUB_STEP_SUMMARY
                    fi

    test-duration-summary:
        name: Test Duration Summary
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [ smoke-fast-fail, test-ubuntu, test-windows, test-macos ]
        if: always()
        steps:
            -   name: Download TRX Artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: test-results-*
                    merge-multiple: true
                    path: test-results

            -   name: Write Top 5 Slowest Tests To Summary
                shell: pwsh
                run: |
                    $trxFiles = @(Get-ChildItem -Path test-results -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
                    if ($trxFiles.Count -eq 0) {
                        "### Slowest tests (top 5)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                        "_No TRX files were found._" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                        exit 0
                    }

                    $results = New-Object System.Collections.Generic.List[object]
                    $skipped = New-Object System.Collections.Generic.List[string]
                    foreach ($trx in $trxFiles) {
                        try {
                            # -Raw avoids Object[] cast failures; try/catch skips malformed TRX (e.g. duplicate attributes).
                            $xmlText = Get-Content -LiteralPath $trx.FullName -Raw -ErrorAction Stop
                            $doc = New-Object System.Xml.XmlDocument
                            $doc.XmlResolver = $null
                            $doc.LoadXml($xmlText)
                        }
                        catch {
                            $skipped.Add(('{0}: {1}' -f $trx.Name, $_.Exception.Message))
                            continue
                        }

                        $nodes = $doc.SelectNodes("//*[local-name()='UnitTestResult']")
                        if ($null -eq $nodes) {
                            continue
                        }

                        foreach ($node in $nodes) {
                            $durationText = $node.duration
                            if ([string]::IsNullOrWhiteSpace($durationText)) {
                                continue
                            }

                            $duration = [TimeSpan]::Zero
                            if (-not [TimeSpan]::TryParse($durationText, [ref]$duration)) {
                                continue
                            }

                            $testName = [string]$node.testName
                            if ([string]::IsNullOrWhiteSpace($testName)) {
                                $testName = "<unknown>"
                            }

                            $results.Add([PSCustomObject]@{
                                Name = $testName
                                Duration = $duration
                                DurationText = $duration.ToString("c")
                            })
                        }
                    }

                    "### Slowest tests (top 5)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                    if ($results.Count -eq 0) {
                        "_No per-test durations found in TRX files._" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                        if ($skipped.Count -gt 0) {
                            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                            "_Skipped malformed TRX: $($skipped.Count)_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                        }
                        exit 0
                    }

                    $top = $results | Sort-Object Duration -Descending | Select-Object -First 5
                    foreach ($item in $top) {
                        ('- {0} - {1}' -f $item.Name, $item.DurationText) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                    }

                    if ($skipped.Count -gt 0) {
                        "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                        "_Skipped malformed TRX: $($skipped.Count)_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                    }

    # Free SonarCloud for public OSS. Create project + SONAR_TOKEN before first green run:
    # https://sonarcloud.io → import GitHub org squirix → project key squirix
    # GitHub secret: SONAR_TOKEN (My Account → Security → Generate Tokens)
    # Optional repo variables: SONAR_ORGANIZATION, SONAR_PROJECT_KEY
    # Coverage: wait for ubuntu test jobs, download Coverlet OpenCover reports, pass
    # sonar.cs.opencover.reportsPaths before end (Cobertura alone is not imported for C#).
    #
    # Quality gate: OSS plan cannot create custom gates (API actions.create=false; only built-in
    # "Sonar way" with Coverage on New Code ≥ 80%). CI Cobertura merge gate stays at 70% overall.
    # sonar.qualitygate.wait=false so Sonar analysis + PR decoration still run, but Sonar way
    # new-coverage does not fail the job. If the org upgrades to Team/Enterprise:
    #   Quality Gates → Create "squirix-ci" (or copy Sonar way) → set new_coverage ≥ 50%
    #   (pragmatic) or ≥ 70% (align with Cobertura) → keep new_duplicated_lines_density ≤ 3%
    #   → assign to project key squirix → then re-enable wait=true below.
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: read
        needs: [ changes, smoke-fast-fail, test-ubuntu ]
        if: |
            (needs.changes.outputs.code == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'squirix' }}
            SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'squirix' }}
        steps:
            -   name: Require SONAR_TOKEN
                shell: bash
                run: |
                    if [[ -z "${SONAR_TOKEN}" ]]; then
                      echo "Missing secrets.SONAR_TOKEN." >&2
                      echo "1) Create a free SonarCloud org/project for public repo squirix/squirix" >&2
                      echo "2) Generate a token (My Account → Security)" >&2
                      echo "3) Add GitHub Actions secret SONAR_TOKEN" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Cache SonarCloud Packages
                uses: actions/cache@v6
                with:
                    path: ~/.sonar/cache
                    key: ${{ runner.os }}-sonar
                    restore-keys: |
                        ${{ runner.os }}-sonar

            -   name: Cache SonarCloud Scanner
                id: cache-sonar-scanner
                uses: actions/cache@v6
                with:
                    path: .sonar/scanner
                    key: ${{ runner.os }}-sonar-scanner
                    restore-keys: |
                        ${{ runner.os }}-sonar-scanner

            -   name: Install SonarCloud Scanner
                if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
                shell: bash
                run: |
                    mkdir -p .sonar/scanner
                    dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

            -   name: Ensure SonarCloud Scanner Present
                shell: bash
                run: |
                    if [[ ! -x .sonar/scanner/dotnet-sonarscanner ]]; then
                      mkdir -p .sonar/scanner
                      dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner
                    fi

            -   name: Download Coverage Reports
                uses: actions/download-artifact@v8
                with:
                    pattern: coverage-raw-net10.0-*
                    merge-multiple: true
                    path: coverage

            -   name: Verify OpenCover Reports For Sonar
                shell: bash
                run: |
                    mapfile -t files < <(find coverage -name coverage.opencover.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                      echo "No coverage.opencover.xml found for SonarCloud import." >&2
                      echo "Expected Coverlet Format=cobertura,opencover from ubuntu test jobs." >&2
                      find coverage -type f -print 2>/dev/null || true
                      exit 1
                    fi
                    echo "Found ${#files[@]} OpenCover report(s) for SonarCloud."

            -   name: Restore
                run: dotnet restore squirix.slnx

            -   name: Analyze With SonarCloud
                shell: bash
                env:
                    GITHUB_EVENT_NAME: ${{ github.event_name }}
                    SONAR_PR_KEY: ${{ github.event.pull_request.number }}
                    SONAR_PR_BRANCH: ${{ github.head_ref }}
                    SONAR_PR_BASE: ${{ github.base_ref }}
                    SONAR_PR_GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    set -euo pipefail

                    begin_args=(
                      begin
                      "/k:${SONAR_PROJECT_KEY}"
                      "/o:${SONAR_ORGANIZATION}"
                      "/d:sonar.token=${SONAR_TOKEN}"
                      "/d:sonar.host.url=https://sonarcloud.io"
                      "/d:sonar.qualitygate.wait=false"
                      "/d:sonar.exclusions=**/bin/**,**/obj/**,**/.sonar/**,**/src/squirix.analyzers/**,**/tools/**,**/samples/**,**/build/**,**/benchmarks/**"
                      "/d:sonar.coverage.exclusions=**/src/squirix.server.host/**,**/src/squirix.protocol-model/Program.cs,**/tools/**,**/samples/**,**/build/**,**/benchmarks/**"
                      "/d:sonar.cs.opencover.reportsPaths=${GITHUB_WORKSPACE}/coverage/**/coverage.opencover.xml"
                    )

                    if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
                      begin_args+=(
                        "/d:sonar.pullrequest.key=${SONAR_PR_KEY}"
                        "/d:sonar.pullrequest.branch=${SONAR_PR_BRANCH}"
                        "/d:sonar.pullrequest.base=${SONAR_PR_BASE}"
                        "/d:sonar.pullrequest.provider=GitHub"
                        "/d:sonar.pullrequest.github.repository=${SONAR_PR_GITHUB_REPOSITORY}"
                      )
                    fi

                    .sonar/scanner/dotnet-sonarscanner "${begin_args[@]}"
                    dotnet build src/squirix.analyzers/Squirix.Analyzers.csproj --configuration Release --no-restore
                    dotnet build squirix.slnx --configuration Release --no-restore
                    .sonar/scanner/dotnet-sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"

    # PVS-Studio Team: full analysis of production packages; fail CI when warnings remain.
    # Secret: PVS_STUDIO_CREDENTIALS = "<license-name> <license-key>"
    # Skipped on fork PRs (secrets unavailable). No SARIF upload.
    pvs-studio:
        name: PVS-Studio
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        needs: [ changes ]
        if: |
            (needs.changes.outputs.code == 'true' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch') &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
        steps:
            -   name: Require PVS_STUDIO_CREDENTIALS
                shell: bash
                env:
                    PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
                run: |
                    if [[ -z "${PVS_STUDIO_CREDENTIALS}" ]]; then
                      echo "Missing secrets.PVS_STUDIO_CREDENTIALS." >&2
                      echo "Add GitHub Actions secret PVS_STUDIO_CREDENTIALS as: <name> <license-key>" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Install PVS-Studio
                shell: bash
                run: |
                    set -euo pipefail
                    # --max-redirect=0: refuse HTTP→attacker redirect of the apt signing material (S6506).
                    wget --max-redirect=0 -qO- https://files.pvs-studio.com/etc/pubkey.txt \
                      | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/viva64.gpg
                    sudo wget --max-redirect=0 -O /etc/apt/sources.list.d/viva64.list \
                      https://files.pvs-studio.com/etc/viva64.list
                    sudo apt-get update
                    sudo apt-get install -y pvs-studio-dotnet

            -   name: Restore
                run: dotnet restore squirix.slnx

            -   name: Build in-repo analyzers
                run: dotnet build src/squirix.analyzers/Squirix.Analyzers.csproj --configuration Release --no-restore

            -   name: Build
                run: dotnet build squirix.slnx --configuration Release --no-restore

            -   name: Configure PVS-Studio License
                shell: bash
                env:
                    PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
                run: |
                    set -euo pipefail
                    # Writes license under ~/.config/PVS-Studio after build; keep secret off restore/build/analyze.
                    # shellcheck disable=SC2086
                    pvs-studio-analyzer credentials ${PVS_STUDIO_CREDENTIALS}

            -   name: Analyze With PVS-Studio
                id: analyze
                shell: bash
                run: |
                    set -uo pipefail
                    mkdir -p pvs-studio-out
                    echo "report=false" >> "$GITHUB_OUTPUT"
                    exit_code=0
                    pvs-studio-dotnet \
                      -t squirix.slnx \
                      -o pvs-studio-out/pvs-studio-report.json \
                      -c Release \
                      -C .pvsconfig \
                      -u pvs-studio.suppress.json \
                      -r \
                      --disableLicenseExpirationCheck \
                      --selectProjects "Squirix;Squirix.Server;Squirix.Server.Host;Squirix.ProtocolModel;Squirix.Analyzers" \
                      || exit_code=$?

                    echo "pvs-studio-dotnet exit_code=${exit_code}"

                    if [[ -f pvs-studio-out/pvs-studio-report.json ]]; then
                      echo "report=true" >> "$GITHUB_OUTPUT"
                    fi

                    # Shell launch failures (126/127) overlap license/analyzer bits if bit-tested first.
                    if [[ "$exit_code" -eq 126 || "$exit_code" -eq 127 ]]; then
                      echo "pvs-studio-dotnet failed to launch (exit_code=${exit_code})." >&2
                      exit 1
                    fi

                    if (( (exit_code & 1) != 0 )); then
                      echo "PVS-Studio license error (exit bit 1)." >&2
                      exit 1
                    fi
                    if (( (exit_code & 2) != 0 )); then
                      echo "PVS-Studio analyzer error (exit bit 2)." >&2
                      exit 1
                    fi
                    # Bit 8 = warnings present. Gate via plog-converter on the JSON report
                    # (post-suppress) with the same all-groups/all-level filter as artifacts.
                    if (( (exit_code & ~4 & ~8) != 0 )); then
                      echo "Unexpected pvs-studio-dotnet exit_code=${exit_code}" >&2
                      exit 1
                    fi

                    if [[ ! -f pvs-studio-out/pvs-studio-report.json ]]; then
                      echo "PVS-Studio report missing." >&2
                      exit 1
                    fi

                    # plog-converter defaults to GA:1,2 only unless -a is set.
                    pvs_all_groups='GA:1,2,3;64:1,2,3;OP:1,2,3;CS:1,2,3;MISRA:1,2,3;AUTOSAR:1,2,3;OWASP:1,2,3'

                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t totals \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-totals.txt \
                      || true
                    if [[ -f pvs-studio-out/pvs-studio-totals.txt ]]; then
                      {
                        echo "## PVS-Studio totals (all groups/levels)"
                        echo '```'
                        cat pvs-studio-out/pvs-studio-totals.txt
                        echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                      cat pvs-studio-out/pvs-studio-totals.txt
                    fi

                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t errorfile \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-all.txt \
                      || true
                    if [[ -f pvs-studio-out/pvs-studio-all.txt ]]; then
                      {
                        echo "## PVS-Studio findings (all)"
                        echo '```'
                        cat pvs-studio-out/pvs-studio-all.txt
                        echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                      echo "--- all findings ---"
                      cat pvs-studio-out/pvs-studio-all.txt
                    fi

                    # Fail CI when any warning remains after suppress filtering (all groups/levels).
                    gate_code=0
                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t totals \
                      -a "${pvs_all_groups}" \
                      -o pvs-studio-out/pvs-studio-gate-totals.txt \
                      --indicate-warnings \
                      || gate_code=$?
                    if [[ -f pvs-studio-out/pvs-studio-gate-totals.txt ]]; then
                      echo "--- gate filter (all groups/levels) ---"
                      cat pvs-studio-out/pvs-studio-gate-totals.txt
                    fi
                    if [[ "$gate_code" -eq 2 ]]; then
                      echo "PVS-Studio gate failed: warnings remain (all groups/levels)." >&2
                      exit 1
                    fi
                    if [[ "$gate_code" -ne 0 ]]; then
                      echo "plog-converter gate failed with exit_code=${gate_code}" >&2
                      exit 1
                    fi

            -   name: Convert Report To HTML
                if: always() && steps.analyze.outputs.report == 'true'
                shell: bash
                run: |
                    set -euo pipefail
                    # fullhtml: -o is the output directory. With -n, plog-converter creates
                    # "<o>/<n>.fullhtml" and requires the -o parent to already exist.
                    mkdir -p pvs-studio-out
                    plog-converter \
                      pvs-studio-out/pvs-studio-report.json \
                      -t fullhtml \
                      -a 'GA:1,2,3;64:1,2,3;OP:1,2,3;CS:1,2,3;MISRA:1,2,3;AUTOSAR:1,2,3;OWASP:1,2,3' \
                      -o pvs-studio-out \
                      -n html

            -   name: Upload PVS-Studio Report
                if: always() && steps.analyze.outputs.report == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: pvs-studio-report
                    retention-days: 14
                    if-no-files-found: warn
                    path: |
                        pvs-studio-out/pvs-studio-report.json
                        pvs-studio-out/pvs-studio-totals.txt
                        pvs-studio-out/pvs-studio-all.txt
                        pvs-studio-out/pvs-studio-gate-totals.txt
                        pvs-studio-out/html.fullhtml/**

    ci-success:
        name: CI success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - changes
            - markdownlint
            - verify-coding-conventions
            - verify-line-endings
            - docker-build
            - build-ubuntu
            - build-windows
            - build-macos
            - smoke-fast-fail
            - benchmarks-fast
            - test-ubuntu
            - test-windows
            - test-macos
            - protocol-model-explorer
            - verify-test-discovery
            - coverage
            - sonarcloud
            - pvs-studio
        if: |
            always() && (
              needs.changes.outputs.docs == 'true' ||
              needs.changes.outputs.code == 'true' ||
              needs.changes.outputs.docker == 'true' ||
              github.event_name == 'schedule' ||
              github.event_name == 'workflow_dispatch'
            )
        steps:
            -   name: Verify Required Checks For This Change Set
                shell: bash
                env:
                    DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
                    CODE_CHANGED: ${{ needs.changes.outputs.code }}
                    EVENT_NAME: ${{ github.event_name }}
                    GITHUB_REF: ${{ github.ref }}
                    GITHUB_BASE_REF: ${{ github.base_ref }}
                    PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                    REPO: ${{ github.repository }}
                    RESULT_MARKDOWNLINT: ${{ needs.markdownlint.result }}
                    RESULT_VERIFY: ${{ needs.verify-coding-conventions.result }}
                    RESULT_LINE_ENDINGS: ${{ needs.verify-line-endings.result }}
                    RESULT_DOCKER: ${{ needs.docker-build.result }}
                    RESULT_BUILD_UBUNTU: ${{ needs.build-ubuntu.result }}
                    RESULT_BUILD_WINDOWS: ${{ needs.build-windows.result }}
                    RESULT_BUILD_MACOS: ${{ needs.build-macos.result }}
                    RESULT_SMOKE: ${{ needs.smoke-fast-fail.result }}
                    RESULT_BENCHMARKS: ${{ needs.benchmarks-fast.result }}
                    RESULT_TEST_UBUNTU: ${{ needs.test-ubuntu.result }}
                    RESULT_TEST_WINDOWS: ${{ needs.test-windows.result }}
                    RESULT_TEST_MACOS: ${{ needs.test-macos.result }}
                    RESULT_PROTOCOL_MODEL_EXPLORER: ${{ needs.protocol-model-explorer.result }}
                    RESULT_DISCOVERY: ${{ needs.verify-test-discovery.result }}
                    RESULT_COVERAGE: ${{ needs.coverage.result }}
                    RESULT_SONAR: ${{ needs.sonarcloud.result }}
                    RESULT_PVS: ${{ needs.pvs-studio.result }}
                run: |
                    set -euo pipefail
                    failed=0

                    require_docs=false
                    require_code=false
                    require_docker=false
                    require_line_endings=false
                    require_benchmarks=false
                    require_sonar=false
                    require_pvs=false
                    if [[ "$DOCS_CHANGED" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_docs=true
                    fi
                    if [[ "$CODE_CHANGED" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_code=true
                    fi
                    if [[ "${{ needs.changes.outputs.docker }}" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      require_docker=true
                    fi
                    if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      require_line_endings=true
                    fi
                    if [[ "$CODE_CHANGED" == "true" && ( "$GITHUB_REF" == "refs/heads/develop" || "$GITHUB_BASE_REF" == "develop" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ) ]]; then
                      require_benchmarks=true
                    fi
                    if [[ "$require_code" == "true" && ( "$EVENT_NAME" != "pull_request" || "$PR_HEAD_REPO" == "$REPO" ) ]]; then
                      require_sonar=true
                      require_pvs=true
                    fi

                    assert_success() {
                      local name="$1"
                      local required="$2"
                      local result="$3"
                      if [[ "$required" != "true" ]]; then
                        echo "SKIP $name (not required for this change set)"
                        return 0
                      fi
                      if [[ "$result" == "success" ]]; then
                        echo "OK   $name"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    assert_success "markdownlint" "$require_docs" "$RESULT_MARKDOWNLINT"
                    assert_success "verify-coding-conventions" "$require_code" "$RESULT_VERIFY"
                    assert_success "verify-line-endings" "$require_line_endings" "$RESULT_LINE_ENDINGS"
                    assert_success "docker-build" "$require_docker" "$RESULT_DOCKER"
                    assert_success_or_skipped() {
                      local name="$1"
                      local required="$2"
                      local result="$3"
                      if [[ "$required" != "true" ]]; then
                        echo "SKIP $name (not required for this change set)"
                        return 0
                      fi
                      if [[ "$result" == "success" || "$result" == "skipped" ]]; then
                        echo "OK   $name result=$result"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    assert_success "build-ubuntu" "$require_code" "$RESULT_BUILD_UBUNTU"
                    assert_success_or_skipped "build-windows" "$require_code" "$RESULT_BUILD_WINDOWS"
                    assert_success_or_skipped "build-macos" "$require_code" "$RESULT_BUILD_MACOS"
                    assert_success "smoke-fast-fail" "$require_code" "$RESULT_SMOKE"
                    assert_success "benchmarks-fast" "$require_benchmarks" "$RESULT_BENCHMARKS"
                    assert_success "test-ubuntu" "$require_code" "$RESULT_TEST_UBUNTU"
                    assert_success_or_skipped "test-windows" "$require_code" "$RESULT_TEST_WINDOWS"
                    assert_success_or_skipped "test-macos" "$require_code" "$RESULT_TEST_MACOS"
                    assert_success "protocol-model-explorer" "$require_code" "$RESULT_PROTOCOL_MODEL_EXPLORER"
                    assert_success "verify-test-discovery" "$require_code" "$RESULT_DISCOVERY"
                    assert_success "coverage" "$require_code" "$RESULT_COVERAGE"
                    assert_success "sonarcloud" "$require_sonar" "$RESULT_SONAR"
                    assert_success "pvs-studio" "$require_pvs" "$RESULT_PVS"

                    if [[ "$failed" -ne 0 ]]; then
                      exit 1
                    fi

    stability-stress:
        name: Stability Stress (Weekly / Manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Restore
                run: dotnet restore squirix.slnx

            -   name: Build in-repo analyzers
                run: dotnet build src/squirix.analyzers/Squirix.Analyzers.csproj --configuration Release --no-restore

            -   name: Build
                run: dotnet build squirix.slnx --configuration Release --no-restore

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Run Selected Resiliency Stress Checks
                run: dotnet run --file ./tools/internal/sqr-resiliency-repeat.cs -- -Iterations 5 -Configuration Release -NoBuild

            -   name: Run E2E Stress Suite
                shell: bash
                env:
                    SQUIRIX_STRESS_SCALE: "0.5"
                run: |
                    set -o pipefail
                    dotnet test tests/squirix.e2e.tests/Squirix.E2ETests.csproj \
                      --configuration Release \
                      --no-build \
                      --blame-hang-timeout 15m \
                      --filter "Suite=Stress"
