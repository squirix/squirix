name: CI
on:
    workflow_dispatch:
        inputs:
            run_stress:
                description: Run the develop E2E stress control
                type: boolean
                default: true
permissions:
    contents: read
env:
    MSBuildEnableWorkloadResolver: false
jobs:
    stability-stress:
        name: Stability Stress (Manual)
        if: github.event_name == 'workflow_dispatch' && inputs.run_stress
        runs-on: windows-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                order: [develop-first, pr-first]
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    global-json-file: global.json

            # Defender scans every file a test creates (journals, snapshots, certificates), which doubles the time of storage-heavy
            # tests. The runner is disposable and runs only this repository's code, so its work folders are excluded from scanning.
            -   name: Exclude Work Folders From Defender
                shell: pwsh
                run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, $env:TEMP

            # The stress tests create their storage under the temp folder; see test-windows: a flush on the system drive takes
            # milliseconds and stalls for seconds, on the work drive it takes 0.1-0.3 ms.
            -   name: Use The Runner Temp Folder
                shell: bash
                run: |
                    echo "TEMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"
                    echo "TMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"

            -   name: Fetch and build both pinned revisions
                shell: pwsh
                run: |
                    git fetch --no-tags origin c8ff455bce5ef9319cb1a7199cf9a59e128449ea ead0c26d79e59b5a3ea7b45c95844de6720d0b06
                    if ($LASTEXITCODE) { exit $LASTEXITCODE }
                    foreach ($arm in @("develop","pr")) {
                        $sha = if ($arm -eq "develop") {"c8ff455bce5ef9319cb1a7199cf9a59e128449ea"} else {"ead0c26d79e59b5a3ea7b45c95844de6720d0b06"}
                        $dir = Join-Path $env:RUNNER_TEMP "source-$arm"
                        git worktree add --detach $dir $sha
                        if ($LASTEXITCODE) { exit $LASTEXITCODE }
                        Push-Location $dir
                        $file = 'tests/squirix.e2e.tests/Cache/MultiNode/Failover/NoQuorumFailoverTests.cs'
                        $old = ': exception.GetType().Name;'
                        $new = ': exception is SquirixTransportException transport ? $"{transport.StatusCode}: {transport.Message}" : exception.GetType().Name;'
                        $body = [IO.File]::ReadAllText((Resolve-Path $file))
                        if (!$body.Contains($old)) { throw "Unexpected diagnostics helper" }
                        [IO.File]::WriteAllText((Resolve-Path $file), $body.Replace($old,$new))
                        dotnet build tests/squirix.e2e.tests/Squirix.E2ETests.csproj --configuration Release
                        if ($LASTEXITCODE) { exit $LASTEXITCODE }
                        Pop-Location
                    }
            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh
            -   name: Alternate matched failover groups
                shell: pwsh
                env:
                    ORDER: ${{ matrix.order }}
                run: |
                    $failed = 0
                    $evidence = Join-Path $env:GITHUB_WORKSPACE "paired"
                    foreach ($pass in 1..5) {
                        $a = (($env:ORDER -eq "develop-first") -eq ($pass % 2 -eq 1))
                        $arms = if ($a) {@("develop","pr")} else {@("pr","develop")}
                        foreach ($arm in $arms) {
                            Push-Location (Join-Path $env:RUNNER_TEMP "source-$arm")
                            dotnet test --project tests/squirix.e2e.tests/Squirix.E2ETests.csproj --configuration Release --no-build --treenode-filter '/*/Squirix.E2ETests.Cache.MultiNode.Failover*/*/*[Suite!=Stress]' --minimum-expected-tests 90 --report-trx --results-directory "$evidence/$arm/$pass"
                            if ($LASTEXITCODE) { $failed++ }
                            Pop-Location
                        }
                    }
                    if ($failed) { exit 2 }
            -   name: Upload both arms
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: paired-${{ matrix.order }}
                    path: paired/
                    if-no-files-found: error
