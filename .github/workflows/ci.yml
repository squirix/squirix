name: CI
on:
    workflow_dispatch:
        inputs:
            run_stress:
                description: Run the develop E2E stress control
                type: boolean
                default: true
permissions:
    contents: read
env:
    MSBuildEnableWorkloadResolver: false
jobs:
    stability-stress:
        name: Stability Stress (Manual)
        if: github.event_name == 'workflow_dispatch' && inputs.run_stress
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    global-json-file: global.json

            # Defender scans every file a test creates (journals, snapshots, certificates), which doubles the time of storage-heavy
            # tests. The runner is disposable and runs only this repository's code, so its work folders are excluded from scanning.
            -   name: Exclude Work Folders From Defender
                shell: pwsh
                run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE, $env:TEMP

            # The stress tests create their storage under the temp folder; see test-windows: a flush on the system drive takes
            # milliseconds and stalls for seconds, on the work drive it takes 0.1-0.3 ms.
            -   name: Use The Runner Temp Folder
                shell: bash
                run: |
                    echo "TEMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"
                    echo "TMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"

            -   name: Restore And Build
                run: dotnet build squirix.slnx --configuration Release

            -   name: Ensure Dev HTTPS Certificate
                shell: bash
                run: bash tools/ci/ensure-dev-https-cert.sh

            -   name: Repeat failover group on develop
                shell: pwsh
                run: |
                    foreach ($pass in 1..10) {
                        dotnet test --project tests/squirix.e2e.tests/Squirix.E2ETests.csproj --configuration Release --no-build --treenode-filter '/*/Squirix.E2ETests.Cache.MultiNode.Failover*/*/*[Suite!=Stress]' --minimum-expected-tests 90 --report-trx --results-directory "rf3-control/pass-$pass" 2>&1 | Tee-Object "pass-$pass.log"
                        if (Select-String -Quiet -Path "pass-$pass.log" -Pattern 'failed ReadAndWriteContinueOnRfThreeMajority') { exit 2 }
                        if (!(Test-Path "rf3-control/pass-$pass/*.trx")) { exit 1 }
                    }
                    exit 0

            -   name: Upload control test results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: rf3-develop-control
                    path: rf3-control/
