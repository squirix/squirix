<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1460" viewBox="0 0 960 1460" role="img" aria-labelledby="title desc">
<title id="title">Squirix request flow</title>
<desc id="desc">A .NET application connects through the client SDK. The entry node routes keys to their owner or group leader. Reads access memory after an optional quorum check. Writes commit before applying to memory, with persistence and replication according to configuration. Local storage receives snapshots and restores memory during recovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" /></marker></defs>
<style>
text { font-family: Arial; fill: #1a1a1a; text-anchor: middle; }
.group { font-size: 30px; font-weight: 600; }
.heading { font-size: 24px; font-weight: 600; }
.detail, .edge-label { font-size: 20px; font-weight: 400; }
.accent { fill: #285f83; }
.node { fill: #fff; stroke: #424950; stroke-width: 1.6; }
.edge { fill: none; stroke: #374151; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dashed { stroke-dasharray: 6 6; }
</style>
<rect width="960" height="1460" fill="#fafafa" />
