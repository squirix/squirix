<text x="245.0" y="776" class="heading" transform="translate(0 40)">Read</text>
<text x="245.0" y="803" class="detail" transform="translate(0 40)">Optional quorum check</text>
<rect x="425" y="740" width="280" height="88" rx="10" class="node" style="stroke:#424950" transform="translate(0 40)" />
<text x="565.0" y="793" class="heading" transform="translate(0 40)">Write</text>
