syntax = "proto3";

// Existing value fields remain compatible. New methods require matching peers; unknown value kinds must be rejected, never decoded as JSON.
package squirix.cache.v2;

option csharp_namespace = "Squirix.Transport.Wire.Cache";

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message CacheEntryWire {
    CacheValue value = 1;
    google.protobuf.Timestamp expires_utc = 2;
    google.protobuf.Duration expiration = 3;
}

message CacheValue {
    oneof kind {
        google.protobuf.NullValue null_value = 1;
        string string_value = 2;
        int64 int64_value = 3;
        double double_value = 4;
        bool bool_value = 5;
        // Exactly one JSON value as UTF-8: no byte order mark, nesting of at most 64 levels, no comments, no trailing commas.
        bytes json_utf8 = 6;
        // Opaque bytes, including an empty value. This is not JSON or Base64 text.
        bytes binary_value = 7;
    }
}

message SetEntryAsyncRequest {
    string cache_name = 1;
    string key = 2;
    CacheEntryWire entry = 3;
    string operation_id = 4;
}

message SetAsyncResponse {}

message GetEntryAsyncRequest {
    string cache_name = 1;
    string key = 2;
}

message GetEntryAsyncResponse {
    bool found = 1;
    CacheEntryWire entry = 2;
    // Time left before the entry expires on the server clock, set when it has a deadline; a client rebases it on its own clock.
    google.protobuf.Duration remaining = 3;
}

message GetValueAsyncRequest {
    string cache_name = 1;
    string key = 2;
}

message GetValueAsyncResponse {
    bool found = 1;
    CacheValue value = 2;
}

message RemoveAsyncRequest {
    string cache_name = 1;
    string key = 2;
    string operation_id = 3;
}

message RemoveAsyncResponse {
    bool removed = 1;
}

message TryAddEntryAsyncRequest {
    string cache_name = 1;
    string key = 2;
    CacheEntryWire entry = 3;
    string operation_id = 4;
}

message TryAddAsyncResponse {
    bool added = 1;
}

message TouchAsyncRequest {
    string cache_name = 1;
    string key = 2;
    google.protobuf.Duration expiration = 3;
    string operation_id = 4;
}

message TouchAsyncResponse {
    bool found = 1;
}

message RemoveExpirationAsyncRequest {
    string cache_name = 1;
    string key = 2;
    string operation_id = 3;
}

message RemoveExpirationAsyncResponse {
    bool found = 1;
}

message UpdateAsyncRequest {
    string cache_name = 1;
    string key = 2;
    CacheEntryWire entry = 3;
    string operation_id = 4;
}

message UpdateAsyncResponse {
    bool updated = 1;
}

message GetExpirationAsyncRequest {
    string cache_name = 1;
    string key = 2;
}

message GetExpirationAsyncResponse {
    bool found = 1;
    bool has_expiration = 2;
    google.protobuf.Duration remaining = 3;
}

message GetOrAddAsyncRequest {
    string cache_name = 1;
    string key = 2;
    CacheEntryWire entry = 3;
    string operation_id = 4;
}

message GetOrAddAsyncResponse {
    // True when the request's value was added; the response then carries no value, because the caller already has it.
    bool added = 1;
    // The value that was already stored; set only when added is false and found is true.
    CacheValue value = 2;
    // True when a value exists after the call: the one just added or the one that was already stored.
    bool found = 3;
}

// Distributed-cache policy requests are staged with their binary transport. Implementations must not ignore an unsupported policy.
message SetDistributedAsyncRequest {
    string cache_name = 1;
    string key = 2;
    bytes value = 3;
    optional int64 expires_at_unix_ms = 4;
    optional int64 sliding_ticks = 5;
    string operation_id = 6;
    optional int64 ttl_ticks = 7;
}

message GetDistributedAsyncRequest {
    string cache_name = 1;
    string key = 2;
    // Lowercase 32-hex correlation ID. Each transport execution reads current state; this is not a response replay key.
    string operation_id = 3;
}

message GetDistributedAsyncResponse {
    bool found = 1;
    bytes value = 2;
}

// Optional envelope for a binary request carrying W3C trace context.
message BinaryTracedRequest {
    string trace_parent = 1;
    string trace_state = 2;
    bytes payload = 3;
}

// Error payload for the batched binary transport.
message BinaryCallError {
    message Trailer {
        string key = 1;
        oneof value {
            string text = 2;
            bytes binary = 3;
        }
    }

    string detail = 1;
    repeated Trailer trailers = 2;
}

enum BinaryOperation {
    BINARY_OPERATION_UNSPECIFIED = 0;
    BINARY_OPERATION_SET_ENTRY = 1;
    BINARY_OPERATION_GET_ENTRY = 2;
    BINARY_OPERATION_GET_VALUE = 3;
    BINARY_OPERATION_REMOVE = 4;
    BINARY_OPERATION_TRY_ADD_ENTRY = 5;
    BINARY_OPERATION_TOUCH = 6;
    BINARY_OPERATION_REMOVE_EXPIRATION = 7;
    BINARY_OPERATION_UPDATE = 8;
    BINARY_OPERATION_GET_EXPIRATION = 9;
    BINARY_OPERATION_GET_OR_ADD = 10;
    BINARY_OPERATION_SET_DISTRIBUTED = 11;
    BINARY_OPERATION_GET_DISTRIBUTED = 12;
    BINARY_OPERATION_REFRESH_DISTRIBUTED = 13;
}

message RefreshDistributedAsyncRequest {
    string cache_name = 1;
    string key = 2;
    string operation_id = 3;
}

message RefreshDistributedAsyncResponse {}
