syntax = "proto3";

package squirix.replication;

option csharp_namespace = "Squirix.Server.Adapters.Grpc.Replication";

// Closed server-only replication contract. Not part of SquirixCache.proto / exported Squirix package.

message ReplicationEnvelopeHeader {
  uint32 schema_version = 1;
  string group_id = 2;
  bytes topology_fingerprint = 3;
  uint64 configuration_generation = 4;
  uint64 term = 5;
  string leader_node_id = 6;
  string sender_node_id = 7;
}

// One replica log entry as the leader stores it: its position and the canonical record bytes, which the follower appends as received.
message ReplicaLogEntry {
  uint64 log_index = 1;
  uint64 term = 2;
  bytes canonical_payload = 3;
}

message AppendReplicaEntriesRequest {
  ReplicationEnvelopeHeader header = 1;
  uint64 prev_log_index = 2;
  uint64 prev_log_term = 3;
  uint64 leader_commit_index = 4;
  // Field 5 carried the decoded entries of earlier builds; it stays reserved so an older peer is never misread as a newer one.
  reserved 5;
  reserved "entries";
  repeated ReplicaLogEntry log_entries = 6;
}

message AppendReplicaEntriesResponse {
  uint64 term = 1;
  uint64 last_log_index = 2;
  bool success = 3;
  string refusal_code = 4;
  // Set while the replying node is at critical memory pressure; an absent field reads as no pressure.
  bool memory_pressure = 5;
}

message GetReplicaStatusRequest {
  ReplicationEnvelopeHeader header = 1;
}

message GetReplicaStatusResponse {
  uint64 term = 1;
  string role = 2;
  uint64 last_log_index = 3;
  uint64 commit_index = 4;
  string readiness = 5;
  bytes topology_fingerprint = 6;
  uint64 configuration_generation = 7;
  string refusal_code = 8;
  uint64 last_log_term = 9;
  uint64 applied_index = 10;
  string member_state = 11;
}

// The owner of a group offers this node a place in the first start of the group. Only the owner may send it: header.sender_node_id
// must equal header.group_id; header.leader_node_id is ignored. accepted is true once the offer is durable on an unseeded copy.
// member_state is the state of the copy after the call, empty when the node does not serve the group.
message OfferReplicaBootstrapRequest {
  ReplicationEnvelopeHeader header = 1;
}

message OfferReplicaBootstrapResponse {
  bool accepted = 1;
  string member_state = 2;
  string refusal_code = 3;
}

// One message of a state transfer from the leader of a group to a member whose copy is behind. Only the leader may send it:
// header.sender_node_id must equal header.leader_node_id, and header.term is the term of the transfer. The group is the one in header.group_id.
// The begin carries sequence 0 and each later message the next number, under one transfer_id; the abort carries no meaningful sequence.
// Exactly one step is set. term in the response is the durable term of the copy, zero when the node does not serve the group; more is set only
// by a wipe that has not emptied the group yet, which the leader sends again. An unusable value is refused, not thrown.
message TransferReplicaStateRequest {
  ReplicationEnvelopeHeader header = 1;
  string transfer_id = 2;
  uint32 sequence = 3;
  oneof step {
    ReplicaTransferBegin begin = 4;
    ReplicaTransferSnapshot snapshot = 5;
    ReplicaTransferWipe wipe = 6;
    ReplicaTransferEntries entries = 7;
    ReplicaTransferEnd end = 8;
    ReplicaTransferAbort abort = 9;
  }
}

// ceiling_checked is set by a leader that read the current terms of members that, with itself and without the receiver, form a majority of
// the group, and found none above header.term. Only such a transfer may repair a copy that lost its disk (unseeded); the copy stays unseeded
// until the end, which records header.term and a vote for header.leader_node_id with the complete state.
message ReplicaTransferBegin {
  uint64 index = 1;
  uint64 index_term = 2;
  uint32 snapshot_bytes = 3;
  uint32 snapshot_checksum = 4;
  bool ceiling_checked = 5;
}

message ReplicaTransferSnapshot {
  uint64 offset = 1;
  bytes chunk = 2;
}

message ReplicaTransferWipe {
}

message ReplicaTransferEntries {
  repeated ReplicaTransferEntry entries = 1;
}

// expires_utc_ticks is zero for an entry without a deadline.
message ReplicaTransferEntry {
  string cache_name = 1;
  bytes key = 2;
  bytes payload = 3;
  int64 expires_utc_ticks = 4;
}

message ReplicaTransferEnd {
  uint64 entry_count = 1;
  uint32 entries_crc32c = 2;
}

message ReplicaTransferAbort {
}

message TransferReplicaStateResponse {
  uint64 term = 1;
  bool success = 2;
  string refusal_code = 3;
  bool more = 4;
}

// Election ballot for one replica group. The candidate is header.sender_node_id; header.leader_node_id is ignored.
// header.term is the proposed term for PreVote (never persisted) and the candidate persisted term for RequestVote.
message ReplicaVoteRequest {
  ReplicationEnvelopeHeader header = 1;
  uint64 last_log_index = 2;
  uint64 last_log_term = 3;
}

// term is the voter durable term after handling the request; zero when it was refused before reaching the log.
message ReplicaVoteResponse {
  uint64 term = 1;
  bool granted = 2;
  string refusal_code = 3;
}

service SquirixReplicationService {
  rpc AppendReplicaEntries (AppendReplicaEntriesRequest) returns (AppendReplicaEntriesResponse);
  rpc GetReplicaStatus (GetReplicaStatusRequest) returns (GetReplicaStatusResponse);
  rpc OfferReplicaBootstrap (OfferReplicaBootstrapRequest) returns (OfferReplicaBootstrapResponse);
  rpc PreVote (ReplicaVoteRequest) returns (ReplicaVoteResponse);
  rpc RequestVote (ReplicaVoteRequest) returns (ReplicaVoteResponse);
  rpc TransferReplicaState (TransferReplicaStateRequest) returns (TransferReplicaStateResponse);
}
